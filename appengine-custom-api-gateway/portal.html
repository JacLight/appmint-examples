<!doctype html><html><meta charset="utf-8"><title>Riverside · Customer portal</title><style>*{box-sizing:border-box}body{margin:0;font:20px system-ui;color:#28223e;background:#f7f4ee}header{padding:35px 65px;border-bottom:1px solid #d8d1c3;display:flex;justify-content:space-between}main{max-width:1300px;margin:60px auto}h1{font-size:56px;letter-spacing:-2px}h2{font-size:30px}input,button{font:inherit;padding:15px 20px;border:1px solid #bbb;border-radius:9px}input{display:block;width:460px;margin:15px 0}button{background:#6335ba;color:white;cursor:pointer}section{background:white;border-radius:22px;padding:32px;margin:25px 0;box-shadow:0 8px 30px #3c285609}pre{font-size:21px;white-space:pre-wrap}.tag{color:#6545a1;font-size:17px}.row{display:flex;gap:25px}.row section{flex:1}#status{padding:10px 0;color:#14715e}.small{font-size:16px;color:#666}</style><header><strong>RIVERSIDE</strong><span>Customer portal · Course gateway implementation</span></header><main><div class="tag">APPMINT APPENGINE · CUSTOMER DATA</div><h1>Your reservations, in one place.</h1><div id="login"><form><input name="email" type="email" placeholder="Customer email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></div><div id="account" hidden><button id="refresh">Refresh my information</button> <button id="logout">Sign out</button><div class="row"><section><h2>Your profile</h2><div id="profile"></div></section><section><h2>Your reservations</h2><div id="bookings"></div></section></div><section><h2>Inspect a reservation</h2><input id="recordid" placeholder="Reservation ID"><button id="read">Read reservation</button><pre id="detail"></pre></section></div><div id="status" role="status"></div><p class="small">Custom client using actual AppEngine responses. Supplier availability later in this course is a local fixture.</p></main><script>
const q=s=>document.querySelector(s);const text=(s,t)=>q(s).textContent=t;async function call(path,method='GET',data){const r=await fetch(path,{method,headers:{'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const b=await r.json();if(r.status===401){q('#login').hidden=false;q('#account').hidden=true;}return{status:r.status,body:b};}async function load(){const p=await call('/api/profile');if(p.status!==200){text('#status',p.body.error||'Sign in required');return;}q('#login').hidden=true;q('#account').hidden=false;const d=p.body.data||p.body;const profile=document.createElement('div');profile.textContent=[d.firstName,d.lastName].filter(Boolean).join(' ')+' · '+d.email;q('#profile').replaceChildren(profile);const r=await call('/api/reservations'),rows=Array.isArray(r.body)?r.body:r.body?.data||[];q('#bookings').replaceChildren();for(const row of rows){const e=document.createElement('p');e.textContent=(row.data?.service||row.data?.title||row.data?.name||'Reservation')+' · '+(row.data?.status||'')+'\n'+row.sk;e.style.whiteSpace='pre-line';q('#bookings').append(e);}if(!rows.length)text('#bookings','No reservations returned.');text('#status','Profile and reservations refreshed from AppEngine.');}q('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await call('/auth/signin','POST',Object.fromEntries(f));text('#status',r.status===200?'Signed in':r.body.error);q('[name=password]').value='';if(r.status===200)await load();};q('#refresh').onclick=load;q('#logout').onclick=async()=>{await call('/auth/logout','POST');q('#account').hidden=true;q('#login').hidden=false;text('#status','Signed out. Server session removed.');};q('#read').onclick=async()=>{const r=await call('/api/reservations/'+q('#recordid').value);const d=r.body.data;const result=d?{status:r.status,recordId:r.body.sk,service:d.service,customer:d.customer?.name,statusInAppEngine:d.status,startTime:d.startTime}:r;text('#detail',JSON.stringify(result,null,2));q('#detail').scrollIntoView({behavior:'smooth',block:'center'});};load();</script></html>
