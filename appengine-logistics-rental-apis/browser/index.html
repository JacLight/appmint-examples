<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbour Moves · AppEngine developer example</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><span class="brandmark">H</span><div>Harbour Moves<small>Rental · Storage · Delivery</small></div></div><div class="topright"><span class="training">Developer sandbox</span><label for="actor">Account slot</label><select id="actor"><option value="staff">Operations · Alex</option><option value="dana">Customer · Dana</option><option value="host">Storage host · Alex</option><option value="sam">Driver · Sam</option></select><button id="signin">Connect account</button></div></header><nav><button data-view="rental" class="selected">Equipment rental</button><button data-view="storage">Box storage</button><button data-view="delivery">Driver delivery</button><button data-view="reference">Developer reference</button></nav><main id="app"></main><div id="message" role="status"></div><dialog id="login"><form id="loginForm"><h2>Connect your AppEngine account</h2><label>Organization<input name="org" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><p>The selected role uses its own staff or customer session.</p><button>Sign in</button><button type="button" onclick="document.querySelector('#login').close()">Cancel</button></form></dialog><script src="app.js"></script></body></html>
