<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AppEngine · Module clients</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">appmint<span>AppEngine example</span></div><nav><button data-view="campaigns" class="active">Campaign workspace</button><button data-view="community">Member community</button><button data-view="moderation">Staff moderation</button></nav><button id="account">Connect account</button></header><main id="main"></main><div id="notice" role="status" hidden></div><dialog id="auth"><form id="signin"><h2>Connect to your organization</h2><p>Use the account type required by this view.</p><label>Organization ID<input name="org" required autocomplete="off"></label><label>Account type<select name="actor"><option value="staff">Staff</option><option value="customer">Customer</option></select></label><label>Email<input type="email" name="email" required autocomplete="off"></label><label>Password<input type="password" name="password" required autocomplete="off"></label><div class="actions"><button type="button" id="cancelAuth">Cancel</button><button class="primary">Sign in</button></div><p id="authError"></p></form></dialog><script type="module" src="app.js"></script></body></html>
