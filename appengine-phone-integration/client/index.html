const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),data=x=>x?.data&&!Array.isArray(x.data)?x.data:x||{},rows=x=>Array.isArray(x)?x:x?.data||x?.devices||x?.phones||[];let loaded=false,state={},view='lines',registration=null,error='',sdkState='Not connected',callState='No active call',actualCall=null,voiceDevice=null,heartbeatTimer=null,deviceEpoch=0,connecting=false,registrationBusy=false,dialing=false,renewalPromise=null,messageBusy=false,localMessages=[],callDetail='',dialDestination='';
const sections=[['lines','Business lines'],['phone','Browser phone'],['devices','Devices'],['messages','Messages'],['history','Call history']];function badge(x,c=''){return `<span class="pill ${c}">${esc(x)}</span>`}function empty(x){return `<div class="empty">${esc(x)}</div>`}function detail(k,v){return `<dt>${esc(k)}</dt><dd>${esc(v??'Not returned')}</dd>`}function heading(t,s){return `<div class="top"><div><div class="eyebrow">APPENGINE · PHONE INTEGRATION</div><h1>${t}</h1><div class="muted">${s}</div></div><button class="secondary" onclick="reload()">Refresh</button></div>`}async function request(path,body){const r=await fetch(path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}:{});const j=await r.json();if(!r.ok)throw Error(j.error||j.message||j.reason||'Request failed');return j}async function action(method,...args){try{error='';const r=await request('/api/action',{method,args});return r.result??r.data}catch(e){error=e.message;render();throw e}}async function reload(){state=await request('/api/state');loaded=true;render()}function go(x){view=x;error='';render()}function assigned(){return rows(state.userPhones)}function allowed(x){return state.capabilities?.[x]===true}function options(){return assigned().map(x=>`<option value="${esc(x.phoneNumber)}">${esc(x.friendlyName||x.phoneNumber)} · ${esc(x.phoneNumber)}</option>`).join('')}
function render(){ if(!loaded){$('#main').innerHTML=heading('Connect your phone workspace','The trusted host reads your staff-scoped AppEngine state.')+(error?`<div class="error">${esc(error)}</div>`:empty('Loading current state…'));return;} $('#nav').innerHTML=sections.map(([k,t])=>`<button class="${view===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('');let html='';const app=state.voiceApp||{};if(view==='lines')html=heading('Your business lines','Assigned numbers and calling readiness for the signed-in staff member.')+`<div class="grid"><section class="panel"><h2>Assigned to you</h2>${assigned().map(x=>`<div class="item"><div class="row"><strong>${esc(x.friendlyName||'Business line')}</strong>${badge(x.assignment)}</div><p class="number">${esc(x.phoneNumber)}</p><dl class="details">${detail('Phone record',x.id)}</dl></div>`).join('')||empty('No number assigned. Ask your administrator to assign a line directly or through your staff group.')}</section><section class="panel"><h2>Outbound calling</h2>${badge(app.ready?'Voice app ready':'Setup required',app.ready?'good':'wait')}<p>${esc(app.message||(app.ready?'The organization has an outbound voice app. A connected device is still required to call.':'Calling readiness has not been established.'))}</p><dl class="details">${detail('Phone setup',app.needsSetup?'Required':app.ready?'Available':'Not confirmed')}${detail('Service agreement',app.needsAgreement?'Required':'No missing agreement reported')}</dl><button onclick="openReference()" class="secondary">Open setup reference</button></section></div>`;
if(view==='phone')html=heading('Browser phone','Device presence, provider registration and the active call have separate states.')+`<div class="grid"><section class="panel"><div class="phone"><div class="phone-symbol">☎</div><label>Calling from</label><select id="from">${options()||'<option>No assigned number</option>'}</select><label>Destination</label><input id="destination" value="${esc(dialDestination)}" type="tel" autocomplete="off" placeholder="Approved test destination"><div class="keypad">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(x=>`<button onclick="digit('${x}')">${x}</button>`).join('')}</div><button style="width:100%" onclick="dial()" ${dialing||!!actualCall||!allowed('call')||sdkState!=='Registered'||!registration?.outboundReady?'disabled':''}>Call</button><div class="actions"><button class="secondary" onclick="actualCall?.disconnect()" ${!actualCall?'disabled':''}>Hang up</button><button class="secondary" onclick="muteCall()" ${!actualCall?'disabled':''}>${actualCall?.isMuted()?'Unmute':'Mute'}</button></div></div></section><section class="panel"><h2>Connection</h2><div class="statusline row"><span>AppEngine device</span>${badge(registration?.voiceAvailable?'Registered':registration?'Unavailable':'Not registered',registration?.voiceAvailable?'good':'')}</div><div class="statusline row"><span>Voice SDK</span>${badge(sdkState,sdkState==='Registered'?'good':'')}</div><div class="statusline row"><span>Call${actualCall?`<br><small class="muted">${esc(actualCall.parameters?.From)} → ${esc(actualCall.parameters?.To)}</small>`:''}</span>${badge(callState,callState==='Connected'?'good':'')}</div>${callDetail?`<p class="muted">${esc(callDetail)}</p>`:''}${registration?.reason?`<div class="notice">${esc(registration.reason)}</div>`:''}<div class="actions"><button onclick="register()" ${registrationBusy||connecting||!!voiceDevice||!allowed('register')?'disabled':''}>Register this browser</button><button class="secondary" onclick="connectSdk()" ${connecting||!!voiceDevice||!registration?.voiceAvailable?'disabled':''}>Connect voice SDK</button></div><div class="actions"><button class="secondary" onclick="unregister()" ${!registration?'disabled':''}>Disconnect this device</button></div><p class="muted">A registered browser is ready to receive a call. The call becomes connected only when the provider reports acceptance.</p>${!allowed('call')?'<div class="notice">Calling is not enabled in this recording environment.</div>':''}</section></div>`;
if(view==='devices')html=heading('Your registered devices','Renew voice tokens separately from presence. Sign out only the intended installation.')+`<section class="panel"><h2>AppEngine presence</h2>${rows(state.devices).length?`<table><thead><tr><th>Device</th><th>Platform</th><th>Capabilities</th><th>Last seen</th></tr></thead><tbody>${rows(state.devices).map(x=>`<tr><td>${esc(x.label||x.deviceId)}</td><td>${esc(x.platform)}</td><td>${esc((x.capabilities||[]).join(', '))}</td><td>${esc(x.lastSeen||x.lastSeenAt||x.registeredAt||'')}</td></tr>`).join('')}</tbody></table>`:empty('No devices returned for this staff identity.')}<div class="actions"><button onclick="heartbeat()" ${!registration?.voiceAvailable?'disabled':''}>Refresh this device</button><button class="secondary" onclick="unregister()" ${registrationBusy||!registration?'disabled':''}>Unregister this browser</button></div><p class="muted">This list reports AppEngine presence. It does not prove a provider SDK connection or an answered call.</p></section>`;
if(view==='routing')html=heading('IVR routing','A number selects the incoming route. The menu defines each key and fallback.')+`<section class="panel"><h2>Saved routing</h2>${rows(state.routings).map(x=>{const d=data(x);return `<div class="item"><strong>${esc(d.name||x.name)}</strong><div class="route"><strong>${esc(d.phoneNumber||d.phoneNumbers?.join(', ')||'Selected number')}</strong><span class="arrow">→</span><strong>${esc(d.routingMode||d.type||'Menu')}</strong></div><p>${esc(d.greeting||'')}</p></div>`}).join('')||empty('Routing configuration is not loaded. Read the saved menu and fallback, then attach the business number through the routing action.')}<button class="secondary" onclick="openReference('ivr')">Open routing reference</button></section>`;
if(view==='messages')html=heading('Business messages','A saved draft, provider acceptance and delivery are different outcomes.')+`<div class="grid"><section class="panel"><h2>Conversation</h2>${[...new Map([...rows(state.messages),...localMessages].map(x=>[x.sk||JSON.stringify(x),x])).values()].map(x=>{const d=data(x);return `<div class="message ${d.direction==='outbound'?'outgoing':''}"><small>${esc(d.from)} → ${esc(Array.isArray(d.to)?d.to.join(', '):d.to)}</small><p>${esc(d.text)}</p>${badge(d.status||'No delivery status')}</div>`}).join('')||empty('Conversation history is not loaded. Successfully saved messages from this session appear here; load the inbox to verify delivery history.')}</section><section class="panel"><h2>Compose</h2><label>From</label><select id="smsFrom">${options()||'<option>No assigned sender</option>'}</select><label>To</label><input id="smsTo" type="tel" placeholder="Approved test recipient"><label>Message</label><textarea id="smsText"></textarea><div class="actions"><button onclick="saveDraft()" ${messageBusy||!allowed('draft')?'disabled':''}>Save draft</button><button onclick="sendSms()" ${messageBusy||!allowed('sms')?'disabled':''}>Send SMS</button></div><p class="muted">Sending requires an eligible sender, provider configuration and an authorized recipient. A draft does not demonstrate delivery.</p></section></div>`;
if(view==='live')html=heading('Live AI calls','Permitted AI voice sessions registered with the live-call service.')+`<section class="panel"><h2>Current sessions</h2>${rows(state.liveCalls).map(x=>`<div class="item"><div class="row"><strong>${esc(x.from)} → ${esc(x.to)}</strong>${badge(x.status||'Active')}</div><p>${esc(x.agent?.name||'')}</p></div>`).join('')||empty('Live supervision is not connected. Connect the authenticated live-call channel to load permitted AI sessions.')}<p class="muted">Listening roles and the AI employee’s supervisor determine access. A takeover also requires your registered softphone.</p></section>`;
if(view==='history')html=heading('Call history','Inspect the saved outcome rather than inferring success from a queued request.')+`<section class="panel">${rows(state.callHistory).length?`<table><thead><tr><th>From</th><th>To</th><th>Direction</th><th>Status</th><th>Duration</th></tr></thead><tbody>${rows(state.callHistory).map(x=>{const d=data(x);return `<tr><td>${esc(d.from)}</td><td>${esc(d.to)}</td><td>${esc(d.direction)}</td><td>${badge(d.status)}</td><td>${esc(d.duration??'—')}</td></tr>`}).join('')}</tbody></table>`:empty('No calls returned for this scope. No connected call is being inferred from an empty history.')}</section>`;$('#main').innerHTML=simulationControls()+(error?`<div class="error">${esc(error)}</div>`:'')+html;}
function simulationControls(){if(!state.simulation)return '';return `<div style="border:2px solid #c18a1c;background:#fff6df;border-radius:12px;padding:12px 18px;margin-bottom:20px"><strong>SIMULATED PHONE SERVICE</strong><span style="margin-left:16px;font-size:14px">Local contract fixture · no carrier, microphone or message delivery</span><div class="actions" style="margin-top:10px">${view==='phone'?'<button class="secondary" onclick="fixtureAction(&quot;answer&quot;)">Simulate remote answer</button><button class="secondary" onclick="fixtureAction(&quot;incoming&quot;)">Simulate incoming call</button><button class="secondary" onclick="fixtureAction(&quot;renew&quot;)">Token expiring</button><button class="secondary" onclick="fixtureAction(&quot;error&quot;)">Connection error</button>':''}${view==='messages'?'<button class="secondary" onclick="fixtureMessage(&quot;sent&quot;)">Simulate sent</button><button class="secondary" onclick="fixtureMessage(&quot;delivered&quot;)">Simulate delivered</button><button class="secondary" onclick="fixtureMessage(&quot;undelivered&quot;)">Simulate undelivered</button>':''}</div></div>`}
async function fixtureAction(name){try{await window.phoneFixture[name]();await reload()}catch(e){showError(e)}}
async function fixtureMessage(status){try{const candidates=[...rows(state.messages),...localMessages].filter(x=>data(x).status!=='draft'),m=candidates.at(-1);if(!m)throw Error('Send a simulated message first');const updated=await request('/fixture/event',{type:'message-status',payload:{id:m.sk,status}});localMessages=localMessages.filter(x=>x.sk!==m.sk);await reload()}catch(e){showError(e)}}
function muteCall(){if(!actualCall)return;actualCall.mute(!actualCall.isMuted());callDetail=actualCall.isMuted()?'Your microphone is muted':'Your microphone is unmuted';render()}
function digit(x){if(actualCall){actualCall.sendDigits(x);callDetail='Sent keypad tone '+x;render();return}if($('#destination'))$('#destination').value+=x}
function deviceId(){let d=localStorage.getItem('appengine-phone-device');if(!d){d=crypto.randomUUID();localStorage.setItem('appengine-phone-device',d)}return d}
function showError(e){error=e.message||String(e);render()}
function stopHeartbeat(){clearInterval(heartbeatTimer);heartbeatTimer=null}
function clearCall(c){if(actualCall!==c)return;actualCall=null;callDetail='';callState='Ended';$('#dialog').close();render()}
async function register(){if(registrationBusy||voiceDevice||connecting)return;registrationBusy=true;render();try{registration=await action('register',{deviceId:deviceId(),platform:'web',label:'Course browser',capabilities:['voice','sms']});await reload()}catch(e){showError(e)}finally{registrationBusy=false;render()}}
async function heartbeat(){try{const r=await action('heartbeat',{deviceId:deviceId()});if(!r.ok)throw Error('AppEngine presence was not refreshed');await reload()}catch(e){showError(e)}}
async function unregister(){if(registrationBusy)return;registrationBusy=true;deviceEpoch++;stopHeartbeat();const old=voiceDevice;voiceDevice=null;connecting=false;actualCall=null;callState='No active call';sdkState='Not connected';$('#dialog').close();old?.destroy();render();try{if(renewalPromise)await renewalPromise.catch(()=>{});const r=await action('unregister',{deviceId:deviceId()});if(!r.ok)throw Error('Device removal was not confirmed; refresh presence before retrying');registration=null;await reload()}catch(e){showError(e)}finally{registrationBusy=false;render()}}
async function connectSdk(){if(connecting||voiceDevice||!registration?.voiceAvailable||!registration?.token)return;if(!window.Twilio?.Device){showError(Error('The Twilio Voice SDK bundle must be installed before provider registration.'));return}const epoch=++deviceEpoch;connecting=true;sdkState='Connecting';render();const device=new Twilio.Device(registration.token);voiceDevice=device;const current=()=>deviceEpoch===epoch&&voiceDevice===device;
 device.on('registered',()=>{if(!current())return;sdkState='Registered';stopHeartbeat();heartbeatTimer=setInterval(async()=>{if(!current()||sdkState!=='Registered')return;try{const r=await action('heartbeat',{deviceId:deviceId()});if(current()&&!r.ok)throw Error('AppEngine presence was not refreshed')}catch(e){if(current()){error='Presence refresh failed: '+e.message;render()}}},60000);render()});
 device.on('unregistered',()=>{if(!current())return;stopHeartbeat();sdkState='Not connected';render()});
 device.on('error',e=>{if(!current())return;stopHeartbeat();error=e.message;sdkState='Error';render()});
 device.on('incoming',c=>{if(!current())return;if(actualCall){c.reject();return}actualCall=watch(c,epoch);callState='Ringing';render();$('#dialog').innerHTML='<h2>'+(state.simulation?'Simulated incoming call':'Incoming call')+'</h2><p>'+esc(c.parameters.From)+'</p><div class="actions"><button onclick="answerIncoming()">Answer</button><button class="secondary" onclick="rejectIncoming()">Reject</button></div>';$('#dialog').showModal()});
 device.on('tokenWillExpire',()=>{if(!current()||renewalPromise)return;renewalPromise=(async()=>{try{const next=await action('register',{deviceId:deviceId(),platform:'web',label:'Course browser',capabilities:['voice','sms']});if(!current())return;if(!next.voiceAvailable||!next.token)throw Error(next.reason||'Voice token renewal failed');registration=next;device.updateToken(next.token);render()}catch(e){if(current()){stopHeartbeat();error='Voice token renewal failed: '+e.message;sdkState='Renewal failed';render()}}finally{renewalPromise=null}})();});
 try{await device.register()}catch(e){if(current()){stopHeartbeat();deviceEpoch++;voiceDevice=null;device.destroy();sdkState='Error';error=e.message;try{const r=await action('unregister',{deviceId:deviceId()});if(r.ok)registration=null}catch(cleanup){error+='; device removal was not confirmed: '+cleanup.message}render()}}finally{if(deviceEpoch===epoch)connecting=false;else if(!voiceDevice)connecting=false;render()}}
function watch(c,epoch=deviceEpoch){const current=()=>epoch===deviceEpoch&&actualCall===c;c.on('accept',()=>{if(!current())return;callState='Connected';render()});for(const name of ['disconnect','cancel','reject'])c.on(name,()=>{if(current())clearCall(c)});c.on('error',e=>{if(!current())return;error=e.message;actualCall=null;callState='Failed';$('#dialog').close();render()});return c}
function answerIncoming(){if(!actualCall)return;actualCall.accept();$('#dialog').close()}
function rejectIncoming(){if(!actualCall)return;const c=actualCall;c.reject();clearCall(c)}
async function dial(){if(dialing||actualCall||dialing||!!actualCall||!allowed('call')||sdkState!=='Registered'||!registration?.outboundReady||!voiceDevice)return;const device=voiceDevice,epoch=deviceEpoch,to=$('#destination').value,from=$('#from').value;dialDestination=to;dialing=true;callState='Calling';render();try{await action('authorizeCall',to,from);if(epoch!==deviceEpoch||device!==voiceDevice)return;const c=await device.connect({params:{To:to,CallerIdOverride:from}});if(epoch!==deviceEpoch||device!==voiceDevice){c.disconnect();return}actualCall=watch(c,epoch);if(c.status?.()==='open')callState='Connected';render()}catch(e){if(epoch===deviceEpoch){error=e.message;callState='Failed';render()}}finally{dialing=false;render()}}
async function saveMessage(method){if(messageBusy)return;const body={from:$('#smsFrom').value,to:[$('#smsTo').value],text:$('#smsText').value};messageBusy=true;render();try{const result=await action(method,body);localMessages.push(result);render()}catch(e){showError(e)}finally{messageBusy=false;render()}}

async function sendSms(){return saveMessage('sendSms')}
function openReference(){window.open('https://appengine.appmint.io/documentation','_blank','noopener')}
$('#dialog').addEventListener('cancel',e=>{if(callState==='Ringing'){e.preventDefault();rejectIncoming()}});
reload().catch(e=>{error=e.message;render()});
</script></html>
