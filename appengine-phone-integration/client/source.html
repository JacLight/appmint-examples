ice = new Device(current.token);", "  let ready = false, sdkRegistered = false, stopped = false, heartbeat;", "  const state = value => onState({state: value, identity: current.identity, outboundReady: current.outboundReady});"], "focus": [12, 13, 17]}, {"id": "events", "title": "State comes from SDK and call events", "file": "examples/browser-softphone.mjs", "start": 39, "lines": ["  const observe = call => {", "    call.on('accept', () => state('connected'));", "    for (const name of ['disconnect', 'cancel', 'reject']) {", "      call.on(name, () => state('ended'));", "    }", "    call.on('error', error => onState({state: 'error', reason: error.message}));", "    return call;", "  };", "  device.on('registered', () => {", "    if (stopped) return;", "    sdkRegistered = true;", "    ready = true;", "    startHeartbeat();", "    state('ready');", "  });"], "focus": [40, 41, 42, 44, 47, 51, 52]}, {"id": "incoming", "title": "Attach listeners before handing the call to your UI", "file": "examples/browser-softphone.mjs", "start": 66, "lines": ["  device.on('incoming', call => {", "    observe(call);", "    state('ringing');", "    onIncoming({", "      from: call.parameters.From,", "      accept: () => call.accept(),", "      reject: () => call.reject(),", "      hangUp: () => call.disconnect(),", "      mute: on => call.mute(on),", "      sendDigits: digits => call.sendDigits(digits),", "    });", "  });"], "focus": [67, 68, 69, 70, 71, 72, 73, 74]}, {"id": "dial", "title": "Connect with destination and assigned caller ID", "file": "examples/browser-softphone.mjs", "start": 109, "lines": ["    async call(to, from) {", "      if (!ready || !current.outboundReady) throw Error('Wait for registered device and enabled outbound calling');", "      if (!current.assignedPhones.some(p => p.phoneNumber === from)) throw Error('Select an assigned caller ID');", "      state('dialing');", "      const call = observe(await device.connect({params: {To: to, phone: to, CallerIdOver
