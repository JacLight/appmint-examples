@font-face{font-family:Inter;src:url('/assets/Inter.woff2')}*{box-sizing:border-box}body{margin:0;background:#f7f6fa;color:#201d36;font:18px Inter,system-ui}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:#7536df;color:white;font-weight:600}button.secondary{background:#f0ebf8;color:#572ca0}button.ghost{background:white;color:#635976;border:1px solid #ded8e7}button:disabled{opacity:.5;cursor:wait}header{height:84px;border-bottom:1px solid #e6e1ed;display:flex;align-items:center;justify-content:space-between;padding:0 36px;background:white}header img{width:135px}header span{font-size:16px;color:#726b82}.layout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 84px)}nav{background:white;border-right:1px solid #e5dfec;padding:30px 18px}nav button{width:100%;background:none;color:#6b627b;text-align:left;margin-bottom:9px;padding:15px 18px;font-size:17px}nav button.active{background:#eee5fc;color:#6e2ed4}main{padding:38px 46px;max-width:1675px;width:100%}.eyebrow{font-size:14px;text-transform:uppercase;letter-spacing:1.7px;color:#7b3cdb;font-weight:700}h1{font-size:34px;letter-spacing:-1px;margin:9px 0 10px}h2{font-size:23px;margin:0 0 19px}h3{font-size:18px;margin:0 0 12px}p{line-height:1.6;margin:8px 0 18px}.muted{color:#7b738a;font-size:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:23px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.panel{background:white;border:1px solid #e7e1ed;border-radius:17px;padding:28px;min-width:0}.panel+.panel{margin-top:20px}.grid>.panel+.panel{margin-top:0}.row{display:flex;align-items:center;justify-content:space-between;gap:20px}.badge{display:inline-block;padding:7px 12px;border-radius:20px;background:#f0eaf9;color:#674590;font-size:14px;font-weight:600}.badge.green{background:#e3f3ec;color:#207b5d}.badge.orange{background:#fff0d er-spacing:1px;color:#8d799d;margin-bottom:8px}#notice{position:fixed;bottom:23px;left:290px;right:48px;border-radius:12px;padding:17px 23px;background:#fff3e2;color:#82571d;box-shadow:0 4px 24px #20152a18;display:none;z-index:10}dialog{border:1px solid #ddd2e8;border-radius:20px;width:790px;max-height:85vh;padding:32px;box-shadow:0 25px 100px #25133933}dialog::backdrop{background:#201b3745}.small{font-size:15px}.break{white-space:pre-wrap}.list{display:flex;flex-wrap:wrap;gap:8px}.scroll{max-height:500px;overflow:auto;padding-right:9px}.content-width{max-width:1180px}a{color:#7736d5}.scope{padding:17px 20px;background:#f5f0fc;border-left:4px solid #9250df;border-radius:7px;font-size:16px;line-height:1.5}@media(max-width:900px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;padding:8px}nav button{white-space:nowrap}.grid,.grid3{grid-template-columns:1fr}main{padding:20px}.details{grid-template-columns:130px 1fr}header{padding:15px}#notice{left:20px;right:20px}}
</style><header><div class="row"><img src="/assets/appmint-logo-black.png" alt="Appmint"><strong>AI integration</strong></div><span>Sample client built on AppEngine</span></header><div class="layout"><nav id="nav"></nav><main id="main"><div class="empty">Loading the organization’s AI configuration…</div></main></div><div id="notice"></div><dialog id="modal"></dialog><script>
let state={},tab='overview',selectedWork=null,chatMode='workspace',messages=[],assistantResult=null,lastAssistantTask='';const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const data=v=>v?.data&&!Array.isArray(v.data)?v.data:(v??{}),rows=v=>Array.isArray(v)?v:(v?.data??v?.items??[]),badge=(t,c='')=>`<span class="badge ${c}">${esc(t||'Not recorded')}</span>`,empty=t=>`<div class="empty">${esc(t)}</div>`;const navigation=[['overview','Employee'],['guidance','Guidance & templates'],['chat','Chat & conversations'],['work','Work & timeline'],['workspace','AI team workspace'],['approvals','Approvals'],['assistant','AI Assistant']];
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error||v.message||`Request failed (${r.status})`);return v}function note(t){$('#notice').textContent=t;$('#notice').style.display='block';clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>$('#notice').style.display='none',9000)}async function action(method,...args){try{const v=await request('/api/action',{method,args});return v.result??v.data??v}catch(e){note(e.message);throw e}}async function reload(){state=await request('/api/state');render()}function go(t){tab=t;selectedWork=null;render()}function heading(title,desc,act=''){return `<div class="top"><div><div class="eyebrow">AppEngine · AI integration</div><h1>${title}</h1><div class="muted">${desc}</div></div>${act}</div>`}function render(){ $('#nav').innerHTML=navigation.map(([id,l])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${l}</button>`).join('');const map={overview,guidance,chat,work,workspace,approvals,assistant};$('#main').innerHTML=map[tab]();}function employee(){return state.employee||{}}function record(){return employee().record?.data||employee().data||employee()}function detail(k,v){return `<dt>${esc(k)}</dt><dd>${esc(v??'Not configured')}</dd>`}
function overview(){const e=employee(),r=record(),rt=r.runtime||{},a=e.access||{};if(!r.name)return heading('Your AI employee','An employee configuration and its own staff identity.')+empty('No course employee has been created yet.');return heading(r.title||r.name,'Configure its role, access and connection.',`<button class="ghost" onclick="reload()">Refresh saved state</button>`)+`<div class="grid"><section class="panel"><div class="person"><div class="avatar">${esc((r.title||'AI').slice(0,1))}</div><div><h2>${esc(r.title)}</h2><div class="muted">${esc(r.jobTitle||r.name)}</div></div>${badge(r.status,r.status==='active'?'green':'')}</div><div class="steps">${(e.setup||[]).map(x=>`<span class="step ${x.done?'done':''}">${x.done?'✓':'○'} ${esc(x.label)}</span>`).join('')}</div><hr class="divider"><h3>Responsibility</h3><p>${esc((r.jobDescription||'').split('. ')[0])}.</p><details><summary class="muted">Read the full responsibility</summary><p class="small">${esc(r.jobDescription)}</p></details><dl class="details">${detail('Staff identity',a.email||r.userEmail)}${detail('Permission groups',(a.groups||[]).join(', '))}${detail('Runtime provider',rt.provider)}${detail('Model',rt.model)}${detail('Working timezone',r.workingHours?.timezone)}${detail('Daily budget',r.limits?.dailyBudgetUsd!=null?'$'+r.limits.dailyBudgetUsd:undefined)}${detail('Jobs at once',r.limits?.maxConcurrentJobs)}</dl><div class="actions"><button onclick="editEmployee()">Edit profile</button><button class="secondary" onclick="runtimeInfo()">Connection</button><button class="ghost" onclick="accessEditor()">Access</button><button class="ghost" onclick="memoryView()">Memory</button><button class="ghost" onclick="controlEmployee('${r.status==='active'?'pause':'switchOn'}')">${r.status==='active'?'Pause employee':'Switch on'}</button></div></section><div><section class="panel"><h2>Current work</h2><div class="grid3">${[['Queued',e.queue?.queued],['Working',e.queue?.in_progress],['Approval',e.queue?.waiting_approval]].map(([k,v])=>`<div><div class="muted">${k}</div><div class="stat">${v??'—'}</div></div>`).join('')}</div><div class="actions"><button class="secondary" onclick="go('work')">Open timeline</button></div></section><section class="panel"><h2>Contact identities</h2><dl class="details">${detail('Employee login',e.contact?.email||a.email)}${detail('Assigned mailboxes',(e.contact?.emails||[]).map(x=>x.emailAddress).join(', ')||'None')}${detail('Assigned phones',(e.contact?.phones||[]).map(x=>x.number||x.phoneNumber||x.name).join(', ')||'None')}</dl><p class="muted">A staff login identifies the employee. Outgoing mail and calls use separately configured services.</p></section></div></div>`}
function guidance(){const c=state.config?.config||{},f=state.config?.from||{},ins=rows(state.instructions);return heading('Guidance that reaches the employee','Company context, inherited defaults and instructions with an explicit audience.')+`<div class="grid"><section class="panel"><div class="row"><h2>Company context</h2>${badge(f.company||'No source')}</div><h3>${esc(c.company?.name||'No company profile')}</h3><p>${esc(c.company?.description||c.company?.about||'')}</p><h3>Starting defaults</h3><dl class="details">${detail('Inherited from',f.defaults)}${detail('Runtime',c.defaults?.runtime?.provider)}${detail('Daily budget',c.defaults?.limits?.dailyBudgetUsd!=null?'$'+c.defaults.limits.dailyBudgetUsd:undefined)}${detail('Concurrent jobs',c.defaults?.limits?.maxConcurrentJobs)}</dl><hr class="divider"><h3>Knowledge</h3>${(c.knowledge?.entries||[]).map(x=>`<div class="item"><strong>${esc(x.title)}</strong><p class="small">${esc(x.content)}</p></div>`).join('')||empty('No knowledge entries configured.')}<div class="actions"><button class="secondary" onclick="effectiveBriefing()">View effective instructions</button></div></section><section class="panel"><h2>Scoped instructions</h2>${ins.map(x=>`<div class="item"><div class="row"><strong>${esc(x.title||x.name||'Instruction')}</strong>${badge(x.enabled===false?'Disabled':'Enabled')}</div><p>${esc(x.content||x.text||x.instructions)}</p><span class="muted">Audience: ${esc(x.who==='only'?'Only '+(x.employees||[]).join(', '):x.who==='except'?'All except '+(x.employees||[]).join(', '):'All employees')}</span></div>`).join('')||empty('No additional instructions returned.')}<hr class="divider"><h3>Available templates</h3><div class="list">${rows(state.templates).map((x,i)=>`<button class="secondary" onclick="templateView(${i})">${esc(data(x).title||data(x).name)}</button>`).join('')||'<span class="muted">No templates returned</span>'}</div></section></div>`}
function messageList(ms){return ms.filter(x=>!x.type||x.type==='message'||x.type==='text').slice().sort((a,b)=>String(a.createdate||a.sentTime||a.timestamp||'').localeCompare(String(b.createdate||b.sentTime||b.timestamp||''))).map(x=>{const d=data(x);d.isMine=!!(d.author||d.from)&&(d.author||d.from)!==record().userEmail;return `<div class="message ${d.isMine?'mine':''}"><div class="author">${esc(d.authorName||d.from||x.author||d.author||'Participant')}</div><div class="body">${esc(d.content||d.text||d.message||'')}</div></div>`}).join('')}
function chat(){return heading(chatMode==='native'?'Chat with your employee':'Direct Workspace conversation','A human message becomes work; the employee answers in the same conversation.',`<button class="ghost" onclick="loadChat()">Refresh conversation</button>`)+`<div class="actions" style="margin:0 0 20px"><button class="${chatMode==='native'?'':'secondary'}" onclick="setChatMode('native')">Chat</button><button class="${chatMode==='workspace'?'':'secondary'}" onclick="setChatMode('workspace')">Workspace direct conversation</button></div><section class="panel content-width"><div class="person"><div class="avatar">${esc((record().title||'AI').slice(0,1))}</div><div><h2>${esc(record().title||'AI employee')}</h2><div class="muted">${esc(record().userEmail||'')}</div></div></div><hr class="divider"><div id="messages" class="scroll">${messageList(messages)||empty('Open the conversation to load saved messages.')}</div><label for="chatText">Message your employee</label><textarea id="chatText" placeholder="Ask a question about the configured company guidance"></textarea><div class="actions"><button onclick="sendChat()">Send message</button></div></section>`}
function work(){const ws=rows(state.work);return heading('Work and its saved result','Follow the assignment, runtime steps and outcome.',`<button onclick="giveWork()">Give work</button>`)+`<div class="grid"><section class="panel" style="max-height:740px;overflow:auto"><h2>Employee queue</h2>${ws.map(x=>{const d=data(x);return `<div class="item"><div class="statusline">${esc(d.source||'Work')} · ${esc(d.status)}</div><div class="row"><div><div class="work-title">${esc(d.title)}</div><p class="muted">${esc(d.ref?.label||'Direct instruction')}</p></div><button class="secondary" onclick="openWork('${esc(x.sk||x.id)}')">View timeline</button></div></div>`}).join('')||empty('No work has been returned.')}</section><section class="panel" id="workDetail" style="max-height:740px;overflow:auto">${workDetail()}</section></div>`}
function workDetail(){if(!selectedWork)return empty('Select a work item.');const d=data(selectedWork);return `<div class="row"><h2>${esc(d.title)}</h2>${badge(d.status,d.status==='done'?'green':'')}</div><p>${esc(d.instructions)}</p><div class="timeline">${(d.steps||d.timeline||[]).map(x=>`<div class="item"><div class="statusline">${esc(x.kind||x.type)}</div><div>${esc(x.text||x.message||x.summary)}</div></div>`).join('')}</div>${d.result?`<hr class="divider"><h3>Runtime result</h3><p class="break">${esc(typeof d.result==='string'?d.result:JSON.stringify(d.result))}</p>`:''}<p class="muted">Verify the affected saved record alongside the runtime’s report.</p>`}
function workspace(){const ws=state.team?.workspace;return heading(ws?.title||'AI team workspace','Human collaboration, shared-room mentions and employee-authored reports.',`<button class="ghost" onclick="loadWorkspace()">Refresh workspace</button>`)+`<div class="grid"><section class="panel"><h2>Team conversation</h2>${ws?`<div class="list">${badge(ws.isPrivate?'Private':'Shared')}${badge((ws.memberCount??'—')+' members')}</div>`:''}<hr class="divider"><div class="scroll">${messageList(rows(state.workspaceMessages))||empty('Load saved team messages.')}</div><label>Message in the shared room</label><textarea id="workspaceText" placeholder="Mention the employee when asking it to respond"></textarea><div class="actions"><button onclick="sendWorkspace()">Mention and send</button></div></section><section class="panel"><div class="row"><h2>Assigned tasks</h2><button class="secondary" onclick="newTask()">Assign task</button></div>${rows(state.tasks).map(x=>{const d=data(x);return `<div class="item"><strong>${esc(d.title)}</strong><p>${esc(d.description)}</p>${badge(d.status)}<p class="muted">${esc((Array.isArray(d.assignTo)?d.assignTo:[d.assignTo||d.assignee]).filter(Boolean).map(v=>typeof v==='string'?v:v.name||v.email||v.title||'Assigned employee').join(', '))}</p></div>`}).join('')||empty('No tasks returned.')}<hr class="divider"><h3>Goals and meetings</h3><p class="muted">Use the team’s agendas and meetings to provide shared context. Assignment and mention determine what reaches the employee’s queue.</p><button class="secondary" onclick="teamContext()">View saved team context</button></section></div>`}
function approvals(){return heading('Human decisions','Review the intended action before approving or rejecting it.')+`<section class="panel content-width">${rows(state.approvals).map(x=>{const d=data(x),a=d.pendingApproval||{};return `<div class="item"><div class="row"><h2>${esc(d.title)}</h2>${badge(d.status,'orange')}</div><p>${esc(a.summary||a.reason||d.instructions)}</p><dl class="details">${detail('Requested action',a.action)}${detail('Requested amount',a.amountUsd)}${detail('Work item',x.sk||x.id)}</dl><div class="actions"><button onclick="decide('${esc(x.sk||x.id)}','approved')">Approve unchanged action</button><button class="ghost" onclick="decide('${esc(x.sk||x.id)}','rejected')">Reject</button></div></div>`}).join('')||empty('No work is currently waiting for approval.')}</section>`}
function assistant(){const a=data(state.assistant||{});return heading('AI Assistant','A configured assistant executes for the caller; it is separate from the employee runtime.')+`<div class="grid"><section class="panel"><div class="row"><h2>${esc(a.title||'Assistant configuration')}</h2>${badge(a.status)}</div><dl class="details">${detail('Visibility',a.visibility)}${detail('Caller','Organization staff session')}${detail('Personality',a.personality)}</dl><hr class="divider"><h3>Selected capabilities</h3><div class="list">${(a.capabilities||[]).map(x=>badge(typeof x==='string'?x:x.name)).join('')||'<span class="muted">None selected</span>'}</div><h3 style="margin-top:25px">Enabled tools</h3><div class="list">${(a.tools||[]).filter(x=>x.enabled!==false).map(x=>badge(x.key||x.name)).join('')||'<span class="muted">No action tools selected</span>'}</div><hr class="divider"><h3>Trigger configuration</h3>${(a.triggers||[]).map(x=>`<div class="item"><strong>${esc((x.events||[]).join(', '))}</strong><p>${esc(x.filter||'Every matching event')}</p><div class="muted">${esc(x.instructions)}</div></div>`).join('')||'<p class="muted">No automatic triggers configured.</p>'}</section><section class="panel"><h2>Use in your application</h2><label>Task for the Assistant</label><textarea id="assistantTask" placeholder="Ask the configured assistant a bounded question">${esc(lastAssistantTask)}</textarea><div class="actions"><button onclick="executeAssistant()">Run assistant</button><button class="secondary" onclick="assistantActivities()">Activity</button></div>${assistantResult?`<hr class="divider"><h3>Actual response</h3><div class="break">${esc(assistantResult.result?.response?.choices?.[0]?.message?.content||assistantResult.response?.choices?.[0]?.message?.content||assistantResult.output||assistantResult.message||'No text response returned')}</div>${(assistantResult.toolResults||[]).map(t=>`<hr class="divider"><h3>${esc(t.tool)} · ${t.success?'returned a result':'failed'}</h3><dl class="details">${detail('Ticket',t.result?.ticketNumber)}${detail('Title',t.result?.title)}${detail('Saved status',t.result?.status)}</dl>`).join('')}`:''}</section></div>`}
function modal(html){$('#modal').innerHTML=html+`<div class="actions"><button class="ghost" onclick="document.querySelector('#modal').close()">Close</button></div>`;$('#modal').showModal();$('#modal').scrollTop=0}async function runtimeInfo(){const r=await action('providerStatus'),p=r.status||{},c=r.connection||{};modal(`<h2>Runtime connection</h2><h3>Provisioned provider</h3><dl class="details">${detail('Provider',r.provider?.title)}${detail('Process',p.state)}${detail('Agent',p.externalId)}${detail('Current activity',p.detail)}</dl><hr class="divider"><h3>Employee’s own connection</h3><dl class="details">${detail('Status',c.label)}${detail('Model',c.model)}${detail('First hello',c.firstSeenAt)}${detail('Last seen',c.lastSeenAt)}</dl><p class="scope">Provider state and the employee’s own hello are separate checks.</p>`)}function templateView(index){const t=data(rows(state.templates)[index]);modal(`<h2>${esc(t.title||t.name)}</h2>${badge(t.source)}<p>${esc(t.summary||t.jobTitle)}</p><h3>Starting responsibility</h3><p>${esc(t.jobDescription)}</p><dl class="details">${detail('Suggested groups',(t.suggestedGroups||[]).join(', '))}${detail('Listening channels',(t.listensTo||[]).join(', ')||'None selected')}</dl><p class="muted">Choose the template when creating an employee, then review its actual access and limits.</p>`)}async function effectiveBriefing(){const v=await action('effectiveInstructions');modal(`<h2>Effective employee instructions</h2><div class="scroll">${rows(v).map(x=>`<div class="item"><div class="row"><h3>${esc(x.title)}</h3>${badge(x.from)}</div><p>${esc(x.content)}</p></div>`).join('')||esc(v.text||v.instructions||'No effective instructions returned.')}</div>`)}async function editEmployee(){const r=record();modal(`<h2>Edit employee profile</h2><div class="grid"><div><label>Job title</label><input id="editTitle" value="${esc(r.jobTitle)}"><label>Working timezone</label><input id="editTimezone" value="${esc(r.workingHours?.timezone)}"><label>Working schedule</label><select id="editAlways"><option value="true" ${r.workingHours?.alwaysOn?'selected':''}>Always available</option><option value="false" ${!r.workingHours?.alwaysOn?'selected':''}>Use saved working hours</option></select></div><div><label>Daily budget (USD)</label><input id="editBudget" type="number" min="0" step="0.25" value="${esc(r.limits?.dailyBudgetUsd)}"><label>Concurrent jobs</label><input id="editConcurrent" type="number" min="1" max="2" value="${esc(r.limits?.maxConcurrentJobs)}"><label>Runtime model</label><input id="editModel" value="${esc(r.runtime?.model)}" readonly></div></div><label>Job description</label><textarea id="editDescription">${esc(r.jobDescription)}</textarea><p class="muted">The same staff groups determine what its API calls can access. Instructions do not grant permissions.</p><button onclick="saveEmployee()">Save profile</button>`)}async function saveEmployee(){const r=record();await action('updateEmployee',{jobTitle:$('#editTitle').value,jobDescription:$('#editDescription').value,workingHours:{...r.workingHours,timezone:$('#editTimezone').value,alwaysOn:$('#editAlways').value==='true'},limits:{...r.limits,dailyBudgetUsd:Number($('#editBudget').value),maxConcurrentJobs:Number($('#editConcurrent').value)}});$('#modal').close();await reload()}async function memoryView(){const m=await action('memory');modal(`<h2>Employee memory</h2><div class="grid"><section class="panel"><h3>Saved notes</h3><div class="stat">${(m.notes||[]).length}</div><p class="muted">Stored on the employee’s own user.</p></section><section class="panel"><h3>Resumable sessions</h3><div class="stat">${m.rememberedSessions??'—'}</div><p class="muted">Provider conversations used when work resumes.</p></section></div>${(m.notes||[]).map(x=>`<div class="item">${esc(data(x).content||data(x).note||data(x).text||'')}</div>`).join('')}<p class="scope">Removing notes and forgetting provider conversations are separate operations. Restarting the runtime does not rewrite company guidance.</p>`)}async function accessEditor(){const v=await action('accessOptions');modal(`<h2>Employee permission groups</h2><p>The employee always retains its AI identity. Add the staff group required by its assigned work.</p><label><input style="width:auto;margin-right:10px" id="userGroup" type="checkbox" ${(v.groups||[]).includes('User')?'checked':''}> User</label><p class="muted">This supplied client exposes the User group for the internal Workspace example. Use your organization’s role design for other responsibilities.</p><button onclick="saveAccess()">Save access</button>`)}async function saveAccess(){await action('setAccess',$('#userGroup').checked?['User']:[]);$('#modal').close();await reload()}async function controlEmployee(method){await action(method);await reload()}async function setChatMode(mode){chatMode=mode;messages=[];await loadChat()}async function loadChat(){const r=await action(chatMode==='native'?'nativeMessages':'chatMessages');messages=rows(r);render()}async function sendChat(){const content=$('#chatText').value.trim();if(!content)return;await action(chatMode==='native'?'sendNative':'sendChat',content);await loadChat()}async function giveWork(){modal('<h2>Give work</h2><label>Title</label><input id="workTitle"><label>Instruction</label><textarea id="workInstruction"></textarea><button onclick="submitWork()">Add to queue</button>')}async function submitWork(){await action('giveWork',{title:$('#workTitle').value,instructions:$('#workInstruction').value});$('#modal').close();await reload()}async function openWork(id){selectedWork=await action('workDetail',id);render()}async function loadWorkspace(){state=await request('/api/state');state.workspaceMessages=await action('workspaceMessages');render()}async function sendWorkspace(){await action('sendWorkspace',$('#workspaceText').value);await loadWorkspace()}function newTask(){modal(`<h2>Assign a Workspace task</h2><label>Title</label><input id="taskTitle"><label>Task description</label><textarea id="taskDescription"></textarea><label>Assigned employee</label><input value="${esc(record().title)}" readonly><button onclick="saveTask()">Create assigned task</button>`)}async function saveTask(){await action('assignTask',{title:$('#taskTitle').value,description:$('#taskDescription').value});$('#modal').close();await reload()}async function teamContext(){const v=await action('teamContext');modal(`<h2>${esc(v.team?.workspace?.title||'Team')} · goals and meetings</h2><h3>Agendas</h3>${rows(v.agenda).map(x=>`<div class="item"><strong>${esc(x.title)}</strong><p>${esc(x.summary)}</p><div class="list">${badge((x.progress?.done??0)+' of '+(x.progress?.total??0)+' tasks done','green')}${badge(x.leadName||x.lead)}</div></div>`).join('')||empty('No agendas returned.')}<hr class="divider"><h3>Meetings</h3>${(v.calendar?.meetings||[]).map(x=>`<div class="item"><div class="row"><strong>${esc(x.title)}</strong>${badge(x.status)}</div><p>${esc(new Date(x.startTime).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short',timeZone:x.timezone||'UTC'}))} · ${esc(x.timezone||'UTC')}</p><div class="muted">Saved meeting context · attendance has not been demonstrated</div></div>`).join('')||empty('No meetings returned.')}`)}async function decide(id,decision){await action('decide',id,{decision});await reload()}async function executeAssistant(){lastAssistantTask=$('#assistantTask').value;assistantResult=await action('executeAssistant',lastAssistantTask);render()}async function assistantActivities(){const v=await action('assistantActivities');modal(`<h2>Assistant activity</h2><div class="scroll">${rows(v).map(x=>{const d=data(x);return `<div class="item"><div class="row"><strong>${esc(d.comment||d.type)}</strong>${badge(d.status)}</div><p>${esc(d.meta?.reply||d.meta?.result?.aiSummary||d.meta?.task||'')}</p>${d.meta?.tool?`<dl class="details">${detail('Tool',d.meta.tool)}${detail('Ticket',d.meta.result?.ticketNumber)}${detail('Saved status',d.meta.result?.status)}</dl>`:''}</div>`}).join('')||empty('No saved activities returned.')}</div>`)}reload().catch(e=>{$('#main').innerHTML=heading('Connect the sample client','The server holds organization credentials privately.')+empty(e.message)});
</script></html>
