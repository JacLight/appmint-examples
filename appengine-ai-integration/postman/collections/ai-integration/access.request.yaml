{
  "$kind": "http-request",
  "method": "PUT",
  "url": "{{base_url}}/ai-employees/{{employee}}/access",
  "order": 4000,
  "headers": [
    {
      "key": "orgid",
      "value": "{{org}}"
    },
    {
      "key": "Content-Type",
      "value": "application/json"
    }
  ],
  "settings": {
    "followRedirects": false
  },
  "scripts": [
    {
      "type": "beforeRequest",
      "language": "text/javascript",
      "code": "if(pm.variables.get('enabled_action') !== 'access') throw new Error('Select only the intended operation and set enabled_action=access; inspect state before repeating writes.');"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\n  \"groups\": [\n    \"User\"\n  ]\n}"
  }
}
