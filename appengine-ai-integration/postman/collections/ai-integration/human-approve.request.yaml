{
  "$kind": "http-request",
  "method": "POST",
  "url": "{{base_url}}/ai-employees/work/{{work_id}}/decide",
  "order": 12000,
  "headers": [
    {
      "key": "orgid",
      "value": "{{org}}"
    },
    {
      "key": "Content-Type",
      "value": "application/json"
    }
  ],
  "settings": {
    "followRedirects": false
  },
  "scripts": [
    {
      "type": "beforeRequest",
      "language": "text/javascript",
      "code": "if(pm.variables.get('enabled_action') !== 'human-approve') throw new Error('Select only the intended operation and set enabled_action=human-approve; inspect state before repeating writes.');"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\n  \"decision\": \"approved\",\n  \"note\": \"Only the unchanged action described in this work item.\"\n}"
  }
}
