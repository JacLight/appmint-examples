{
  "$kind": "http-request",
  "method": "POST",
  "url": "{{base_url}}/workspace/{{workspace_id}}/item",
  "order": 10000,
  "headers": [
    {
      "key": "orgid",
      "value": "{{org}}"
    },
    {
      "key": "Content-Type",
      "value": "application/json"
    }
  ],
  "settings": {
    "followRedirects": false
  },
  "scripts": [
    {
      "type": "beforeRequest",
      "language": "text/javascript",
      "code": "if(pm.variables.get('enabled_action') !== 'workspace-mention') throw new Error('Select only the intended operation and set enabled_action=workspace-mention; inspect state before repeating writes.');"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\n  \"type\": \"message\",\n  \"message\": \"Read your actual summary and post one brief report here.\",\n  \"mentions\": [\n    \"{{employee_email}}\"\n  ]\n}"
  }
}
