{
  "$kind": "http-request",
  "method": "POST",
  "url": "{{base_url}}/crm/ai-assistant/{{assistant_id}}/execute",
  "order": 21000,
  "headers": [
    {
      "key": "orgid",
      "value": "{{org}}"
    },
    {
      "key": "Content-Type",
      "value": "application/json"
    }
  ],
  "settings": {
    "followRedirects": false
  },
  "scripts": [
    {
      "type": "beforeRequest",
      "language": "text/javascript",
      "code": "if(pm.variables.get('enabled_action') !== 'assistant-execute') throw new Error('Select only the intended operation and set enabled_action=assistant-execute; inspect state before repeating writes.');"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\n  \"task\": \"Use get_ticket to read ticket {{ticket_number}}; report only its actual title and status. Do not change it.\"\n}"
  }
}
