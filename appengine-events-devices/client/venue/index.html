<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar · Venue operations</title><style>
@font-face{font-family:Inter;src:url('/assets/Inter.woff2')}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#f5f7fa;color:#162239;font-size:20px}aside{position:fixed;inset:0 auto 0 0;width:280px;background:#14273f;color:white;padding:38px 28px}.brand{font-size:34px;font-weight:850;letter-spacing:-1px}.brand b{color:#8dbbff}.sub{font-size:15px;color:#b2c3d8;margin-top:10px}nav{display:grid;gap:10px;margin-top:65px}nav button{border:0;background:transparent;color:#ccd8e7;text-align:left;font-size:19px;padding:16px 18px;border-radius:10px;cursor:pointer}nav button.on{background:#314e72;color:white}aside footer{position:absolute;bottom:28px;left:28px;right:22px;font-size:14px;line-height:1.6;color:#b2c3d8}main{margin-left:280px;padding:38px 56px}header{height:80px;border-bottom:1px solid #dde3eb;display:flex;justify-content:space-between;align-items:start;margin-bottom:32px}.eyebrow{font-size:14px;letter-spacing:.6px;color:#60758b;text-transform:uppercase}.eventname{font-size:23px;font-weight:750;margin-top:8px}.staff{display:flex;gap:12px;align-items:center;font-size:17px}.avatar{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#e2eaff;color:#335fb3}.small{font-size:15px;color:#60758b;line-height:1.5}h1{font-size:39px;letter-spacing:-1px;margin:0 0 10px}h2{font-size:25px;margin:0 0 20px}h3{font-size:20px;margin:0 0 12px}p{line-height:1.55;margin:10px 0 24px}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px}.card{background:white;border:1px solid #dce3eb;border-radius:18px;padding:28px;margin:24px 0}.grid .card{margin:0}.pill{display:inline-block;border-radius:7px;background:#eaf0f8;padding:6px 10px;font-size:14px;font-weight:700}.green{background:#e1f3e9;color:#196246}.red{background:#fbe6e2;color:#9c3324}.amber{background:#fff0d0;color:#8b5d00}.button{border:0;background:#285b9a;color:white;padding:13px 19px;font-family:inherit;font-size:17px;font-weight:650;border-radius:9px;cursor:pointer}.button.secondary{background:#eaf0f8;color:#28435f}.button.danger{background:#fbe6e2;color:#9c3324}.button:disabled{opacity:.5;cursor:wait}.row{display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid #e4e9ef;padding:17px 0}.row:last-child{border:0}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}label{display:block;font-size:16px;font-weight:650;margin:20px 0 8px}input,select{font:20px Inter;width:100%;border:1px solid #cbd6e3;border-radius:9px;padding:13px;background:white;color:#162239}.scan{font-family:monospace;font-size:26px;letter-spacing:1px}.result{padding:22px;border-radius:12px;margin-top:22px;border-left:5px solid #7289a4;background:#edf2f8}.result.good{background:#e4f4eb;border-color:#2e9670}.result.bad{background:#fff0eb;border-color:#c55b43}.result h3{font-size:25px;margin:0 0 7px}.result p{margin:0;font-size:18px}.metric{font-size:85px;font-weight:800;line-height:1;color:#285b9a;margin:25px 0 16px}.metric span{font-size:28px;color:#7e91a7}.meter{height:15px;background:#e9eef5;border-radius:10px;overflow:hidden}.meter div{height:100%;background:#3977bc;transition:width .25s}table{width:100%;border-collapse:collapse;font-size:18px}td,th{padding:18px 12px;border-bottom:1px solid #e1e7ee;text-align:left}th{font-size:14px;color:#60758b;text-transform:uppercase}.mono{font:16px monospace;word-break:break-all}.badge{max-width:470px;margin:20px auto;border:2px solid #dce3eb;border-radius:18px;overflow:hidden;text-align:center}.badge .band{background:#285b9a;color:white;font-weight:800;font-size:22px;padding:18px}.badge .person{font-size:32px;font-weight:750;padding:32px 20px 8px}.barcode{height:64px;background:repeating-linear-gradient(90deg,#162239 0 3px,white 3px 5px,#162239 5px 6px,white 6px 10px);margin:30px 42px 8px}.badge .code{padding:8px 20px 25px;font-family:monospace}.note{background:#edf2f8;border-left:4px solid #5276a4;padding:16px 20px;font-size:17px;line-height:1.6}.loading{position:fixed;bottom:25px;right:30px;background:#14273f;color:white;border-radius:9px;padding:14px 22px;z-index:10;font-size:17px}#status:empty{display:none}.step{display:inline-flex;align-items:center;gap:12px}.dot{width:13px;height:13px;border-radius:50%;background:#2e9670}.empty{padding:30px;color:#60758b}pre{font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}.floor{display:flex;justify-content:center;align-items:center;height:130px;background:#f1f5fb;border:2px dashed #ccd9e9;border-radius:14px;margin:20px 0}.person-icon{width:40px;height:55px;position:relative}.person-icon:before{content:'';position:absolute;width:20px;height:20px;background:#285b9a;border-radius:50%;left:10px;top:0}.person-icon:after{content:'';position:absolute;left:2px;top:25px;width:36px;height:30px;background:#285b9a;border-radius:14px 14px 4px 4px}.no-person{font-size:17px;color:#71859d}.data-pair{display:grid;grid-template-columns:180px 1fr;gap:18px;padding:14px 0;border-bottom:1px solid #e7ebf0}.data-pair b{font-size:17px;color:#60758b}.hint{font-size:14px;color:#75879a}dialog{border:0;border-radius:20px;max-width:800px;padding:32px;box-shadow:0 20px 90px #0a172a40}dialog::backdrop{background:#18273b55}.close{float:right;border:0;background:#eaf0f8;padding:9px 12px;border-radius:50%;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e8a236;outline-offset:3px}
.signed-qr svg{display:block;width:100%;height:auto;max-width:240px}</style></head><body><aside><div class="brand">northstar<b>✦</b></div><div class="sub">Venue operations</div><nav id="nav"></nav><footer>Sample client built on AppEngine<br>Typed scan input · training event<br>No physical device actuation</footer></aside><main><header><div><div class="eyebrow">Selected event</div><div class="eventname" id="eventname">Connecting…</div></div><div class="staff"><span class="avatar">S</span><div>Venue staff<div class="small">Trusted staff session</div></div><button class="button secondary" onclick="reload()">Refresh</button></div></header><div id="status"></div><section id="content"></section></main><dialog id="modal"><button class="close" onclick="this.closest('dialog').close()">×</button><div id="modal-content"></div></dialog><script>
let S=null,view='gate',last=null,busyCount=0,selected=null,lastQR=null;const views=[['gate','Admission gate'],['setup','Event setup'],['tickets','Tickets & codes'],['benefits','Benefits counter'],['credentials','Venue credentials'],['badge','Badge & routing'],['crew','Crew access'],['history','Movement history']];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const data=x=>x?.data||x||{},rows=x=>Array.isArray(x)?x:(x?.data||x?.items||[]);const ticket=id=>rows(S.tickets).find(t=>t.sk===id);const code=t=>t?.name||data(t).code||'';
async function request(path,body){busyCount++;busy();try{let r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}),j=await r.json();if(!r.ok)throw Error(j.error||j.message||'Request failed');return j}finally{busyCount--;busy()}}
function busy(){document.querySelector('.loading')?.remove();if(busyCount){let el=document.createElement('div');el.className='loading';el.textContent='Reading AppEngine…';document.body.append(el)}}
async function reload(){S=await request('/api/state');selected=selected||S.fixture.capture?.ada?.id||rows(S.tickets)[0]?.sk;document.getElementById('eventname').textContent=data(S.event).title||'Northstar Summit';render()}
async function act(method,...args){const j=await request('/api/action',{method,args});return j.result}
function notify(msg,bad=false){document.getElementById('status').innerHTML=`<div class="result ${bad?'bad':'good'}"><p>${esc(msg)}</p></div>`}
function nav(name){view=name;last=null;document.getElementById('status').innerHTML='';render()}
function render(){document.getElementById('nav').innerHTML=views.map(([v,n])=>`<button class="${v===view?'on':''}" onclick="nav('${v}')">${n}</button>`).join('');if(!S)return;const renderers={gate,setup,tickets,benefits,credentials,badge,crew,history};document.getElementById('content').innerHTML=renderers[view]()}
function pair(k,v){return `<div class="data-pair"><b>${esc(k)}</b><span>${esc(v)}</span></div>`}function title(t,d){return `<h1>${t}</h1><p class="small">${d}</p>`}function options(){return rows(S.tickets).map(t=>`<option value="${esc(t.sk)}" ${selected===t.sk?'selected':''}>${esc(data(t).holderName||t.name)} · ${esc(t.name)}</option>`).join('')}function choose(){return `<label for="ticket">Ticket holder</label><select id="ticket" onchange="selected=this.value;last=null;render()">${options()}</select>`}function zone(){return S.occupancy?.[S.fixture.zone]||Object.values(S.occupancy||{})[0]||{currentOccupancy:0,capacity:1,zoneName:'Main Hall'}}
function outcome(){if(!last)return '<div class="result"><h3>Ready for a code</h3><p>Display the server’s decision before admitting the holder.</p></div>';const d=last.decision||last;const ok=d.success===true||d.eligible===true;return `<div class="result ${ok?'good':'bad'}" id="decision"><h3>${ok?(d.claimed?'Benefit redeemed':d.eligible?'Eligible — preview only':'Accepted'):'Not permitted'}</h3><p>${esc(d.reason||(d.claimed?'Saved entitlement claim returned by AppEngine.':d.eligible?'No benefit consumed by this preview.':'AppEngine returned a successful movement.'))}</p>${d.ticket?`<p class="small">${esc(data(d.ticket).holderName)} · ${esc(d.ticket.name)}</p>`:''}</div>`}
function occupancy(){let z=zone();return `<div class="card"><span class="pill">${esc(z.zoneName||'Main Hall')}</span><div class="metric">${z.currentOccupancy}<span> / ${z.capacity}</span></div><h2>Currently inside</h2><div class="meter"><div style="width:${Math.min(100,100*z.currentOccupancy/(z.capacity||1))}%"></div></div><div class="floor">${z.currentOccupancy?'<span class="person-icon"></span>':'<span class="no-person">Hall is empty</span>'}</div>${pair('Available places',z.availableCapacity??'—')}${pair('Entrance records',z.totalEntranceScans??0)}<p class="small">Refreshed from saved AppEngine occupancy after each operation.</p></div>`}
function gate(){const points=data(S.event).scanPoints||[];return title('Admission gate','Typed-code demonstration. No physical scanner is connected.')+`<div class="grid"><div class="card"><div class="step"><span class="dot"></span><h2 style="margin:0">Entrance → ${esc(zone().zoneName||'Main Hall')}</h2></div>${choose()}<label for="scan">Scanned or typed code</label><input id="scan" class="scan" value="${esc(code(ticket(selected)))}"><div class="actions"><button class="button" onclick="scan('admit')">Admit holder</button><button class="button secondary" onclick="scan('exit')">Record exit</button></div>${outcome()}<p class="small">Point: ${esc(S.fixture.entrance)} · Zone: ${esc(S.fixture.zone)}</p></div>${occupancy()}</div>`}
async function scan(method){try{let value=document.getElementById('scan').value;last=await act(method,value);render();const keep=last;try{await reload();last=keep;render();if(keep.refreshError)notify('Decision saved. Occupancy refresh needs retry: '+keep.refreshError,true)}catch(e){last=keep;render();notify('Decision saved; latest count could not be loaded. '+e.message,true)}}catch(e){notify(e.message,true)}}

function setup(){let e=data(S.event),t=data(rows(S.ticketTypes)[0]);return title('Event setup','Use the saved event, zone and point definitions to build the venue interface.')+`<div class="grid"><div class="card"><h2>${esc(e.title)}</h2>${pair('Status',e.status)}${pair('Starts',e.startTime)}${pair('Timezone',e.timezone)}${pair('Event ID',S.event.sk)}<h3 style="margin-top:25px">Zones</h3>${(e.zones||[]).map(z=>pair(z.name,`Capacity ${z.capacity} · ${z.id}`)).join('')}</div><div class="card"><h2>Configured scan points</h2>${(e.scanPoints||[]).map(p=>`<div class="row"><div><b>${esc(p.name||p.id)}</b><div class="small">${esc(p.zone)} · ${esc(p.type||p.scanType||'event point')}</div></div><span class="pill">${p.acceptedPerkIds?.length?'Benefit':'Admission'}</span></div>`).join('')}<h3 style="margin-top:28px">${esc(t.title||t.name||'Ticket type')}</h3>${pair('Re-entry',String(t.allowReentry))}${pair('Return limit',t.reentryLimit)}${pair('Included benefits',(t.perks||[]).map(p=>p.name||p.title||p.id).join(', '))}</div></div>`}
function tickets(){return title('Tickets & codes','A ticket is the saved entitlement. A code is one way to present it.')+`<div class="card"><table><thead><tr><th>Holder</th><th>Ticket code</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows(S.tickets).map(t=>`<tr><td><b>${esc(data(t).holderName)}</b></td><td class="mono">${esc(t.name)}</td><td><span class="pill">${esc(data(t).currentZone?'Inside':data(t).status==='checked_in'?'Outside':data(t).status)}</span></td><td><button class="button secondary" onclick="ticketDetails('${t.sk}')">View ticket</button> <button class="button secondary" onclick="fresh('${t.sk}')">Request fresh QR</button></td></tr>`).join('')}</tbody></table></div><div class="note">Request a fresh signed QR immediately before use. Do not generate its signature in the venue client. Static ticket codes and imported credentials are separate alternatives.</div>`}
function ticketDetails(id){let t=ticket(id),d=data(t);document.getElementById('modal-content').innerHTML=`<h2>${esc(d.holderName)}</h2><p class="small">Saved event ticket · ${esc(t.name)}</p>${pair('Ticket ID',t.sk)}${pair('Ticket type',data(rows(S.ticketTypes).find(x=>x.sk===d.ticketType)).title||d.ticketType)}${pair('Current zone',d.currentZone||'Outside')}<h3 style="margin-top:22px">Included entitlements</h3>${(d.perks||[]).map(p=>pair(p.name,`${p.claimedCount||0} claimed of ${p.quantity}`)).join('')}`;document.getElementById('modal').showModal()}
async function fresh(id){try{selected=id;lastQR=await act('freshQr',id);let q=lastQR.ticket||lastQR,d=data(q);document.getElementById('modal-content').innerHTML=`<h2>Fresh ticket presentation</h2><div style="display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:center"><div class="signed-qr" style="width:240px;min-width:0">${lastQR.qrSvg||''}</div><div><h3>${esc(d.holderName)}</h3><span class="pill amber">Short-lived signed QR</span><p class="small">Request close to entry. Admission rotates the code.</p><p class="mono">${esc(q.name)}</p><button class="button" onclick="useFreshQr()">Use at admission gate</button></div></div><p class="small">Actual AppEngine-signed value, rendered locally. Typed input proves the API decision.</p>`;document.getElementById('modal').showModal()}catch(e){notify(e.message,true)}}
function useFreshQr(){const c=data(lastQR.ticket||lastQR).code;document.getElementById('modal').close();nav('gate');document.getElementById('scan').value=c;}

function benefits(){return title('Benefits counter','Eligibility and redemption do not admit a person or change occupancy.')+`<div class="grid"><div class="card"><span class="pill">${esc(S.fixture.benefitPoint)}</span>${choose()}<div class="actions"><button class="button secondary" onclick="benefit(false)">Preview eligibility</button><button class="button" onclick="benefit(true)">Redeem included benefit</button></div>${last?outcome():''}<div id="perks"></div></div>${occupancy()}</div>`}
async function benefit(redeem){try{last=await act('benefit',code(ticket(selected)),{redeem});const keep=last;render();await reload();last=keep;render();const ps=await act('perks',selected);const perks=data(ps).perks||[];document.getElementById('perks').innerHTML='<h3 style="margin-top:28px">Saved entitlement</h3>'+perks.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><div class="small">${p.claimedCount||0} claimed of ${p.quantity}</div></div><span class="pill ${p.claimedCount>=p.quantity?'amber':'green'}">${Math.max(0,p.quantity-(p.claimedCount||0))} remaining</span></div>`).join('')}catch(e){notify(e.message,true)}}

function credentials(){return title('Venue credentials','Import a venue code, link it to the selected ticket, then revoke it when retired.')+`<div class="grid"><div class="card">${choose()}<p class="small">Point: ${esc(S.fixture.credentialEntrance)} · Match field: credential_code</p><label for="credential">Wristband / badge code</label><input id="credential" class="scan" value="${esc(S.fixture.captureCredentialCode||S.fixture.credentialCode||'NORTHSTAR-BAND-01')}"><div class="actions"><button class="button secondary" onclick="credential('importCredential')">Import code</button><button class="button" onclick="credential('assignCredential')">Assign to ticket</button><button class="button danger" onclick="credential('revokeCredential')">Revoke code</button></div><div class="actions"><button class="button secondary" onclick="credential('admitCredential')">Test this code at entrance</button></div>${last?outcome():''}</div><div class="card"><h2>Saved credential register</h2><div id="credential-list">${rows(S.credentials).map(c=>`<div class="row"><div><b>${esc(data(c).code||c.name)}</b><div class="small">${esc(data(c).ticket||'Not assigned')}</div></div><span class="pill">${esc(data(c).status||'available')}</span></div>`).join('')||'<p class="empty">No imported codes yet</p>'}</div><p class="small">Typed code input proves the software decision. It does not prove a physical scanner read.</p></div></div>`}
async function credential(method){try{const c=document.getElementById('credential').value;let result=await act(method,...(method==='assignCredential'?[c,selected]:[c]));if(method==='admitCredential')last=result;else notify('Credential operation saved and register reloaded.');const keep=last;await reload();last=keep;render()}catch(e){notify(e.message,true)}}
function badge(){return title('Badge & device routing','Actual badge data; explicitly console-only dispatch. No physical printer is connected.')+`<div class="grid"><div class="card">${choose()}<div class="actions"><button class="button secondary" onclick="loadBadge(false)">Read badge data</button><button class="button" onclick="loadBadge(true)">Send to console adapter</button></div><div id="badge-result"></div></div><div class="card"><h2>Output boundary</h2><div class="note">The console adapter can acknowledge software dispatch. Paper output still requires the installed device agent, matching hub/endpoint routing, a real printer and operator confirmation.</div><p>No printed marker is sent by this teaching client.</p><span class="pill amber">Physical output not verified</span></div></div>`}
async function loadBadge(dispatch){try{let r=await act(dispatch?'previewBadgeDispatch':'badge',selected),b=dispatch?r.badge:r,d=b.badgeData||{};document.getElementById('badge-result').innerHTML=`<div class="badge"><div class="band">${esc(d.eventTitle||data(S.event).title)}</div><div class="person">${esc(d.holderName)}</div><div>${esc(d.ticketType||d.ticketTypeName||'Event pass')}</div><div style="margin:22px 42px 0;border-top:1px dashed #b7c5d5"></div><div class="code">${esc(d.code)}</div></div><p class="hint">Badge preview from actual returned data. The console handoff includes a CODE128 instruction.</p>${dispatch?'<div class="result good"><h3>Console dispatch returned</h3><p>No physical print is claimed.</p><p class="small">Adapter: console · Accepted: '+esc(r.dispatch?.ok)+'<br>Dispatch reference: '+esc(r.dispatch?.ref)+'</p></div>':''}`}catch(e){notify(e.message,true)}}
function crew(){return title('Crew access','Separate access-control policy. Decision only — no door actuator is configured.')+`<div class="card"><h2>Crew reader</h2><p>The crew exercise uses its own access credential and reader key. It is not an event ticket check-in.</p><div id="crew-state">${pair('Reader',data(S.crew?.reader).title||S.fixture.crew.reader)}${pair('Access point',data(S.crew?.reader).accessPoint||S.fixture.crew.point)}${pair('Actuator triggers',(data(S.crew?.reader).triggers||[]).length)}</div><div class="actions"><button class="button" onclick="crewRead()">Read crew credential</button><button class="button secondary" onclick="crewCredential(true)">Enable credential</button><button class="button danger" onclick="crewCredential(false)">Suspend credential</button></div><div id="crew-result"></div><div class="actions"><button class="button secondary" onclick="crewLog()">Read credential history</button></div><div id="crew-history"></div></div>`}
async function crewRead(){try{const r=await act('crewRead');document.getElementById('crew-result').innerHTML='<div class="result '+(r.result==='granted'?'good':'bad')+'"><h3>'+esc(r.result==='granted'?'Access granted':'Access denied')+'</h3><p>'+esc(r.reason||r.result)+'</p>'+('unlocked' in r?'<p>Door unlocked: '+esc(r.unlocked)+'</p>':'')+'<p>Decision-only reader: no physical door output.</p></div>'}catch(e){notify(e.message,true)}}

async function crewLog(){try{const h=await act('crewHistory');document.getElementById('crew-history').innerHTML='<h3 style="margin-top:22px">Saved access decisions</h3><table><thead><tr><th>Time</th><th>Decision</th><th>Reason</th></tr></thead><tbody>'+rows(h).filter(x=>data(x).type==='access').slice(0,2).map(x=>{let d=data(x);return `<tr><td>${esc(new Date(d.occurredAt).toLocaleTimeString('en-US'))}</td><td><span class="pill ${d.result==='granted'?'green':'red'}">${esc(d.result)}</span></td><td>${esc(d.reason||d.decidedBy?.source)}</td></tr>`}).join('')+'</tbody></table>'}catch(e){notify(e.message,true)}}
function history(){const t=ticket(selected),d=data(t);return title('Movement history','Reconcile a ticket’s saved movements before retrying an uncertain action.')+`<div class="grid"><div class="card">${choose()}${pair('Ticket status',d.status)}${pair('Current zone',d.currentZone||'Outside')}<h3 style="margin-top:22px">Saved movements</h3><table><thead><tr><th>Time</th><th>Movement</th><th>Point</th></tr></thead><tbody>${(d.checkIns||[]).map(c=>`<tr><td>${esc(new Date(c.timestamp).toLocaleTimeString('en-US'))}</td><td><span class="pill ${c.direction==='in'?'green':''}">${esc(c.direction)}</span></td><td>${esc(c.scanPointId)}</td></tr>`).join('')}</tbody></table></div>${occupancy()}</div>`}

async function crewCredential(active){try{await act('crewCredential',active);notify(active?'Crew credential enabled.':'Crew credential suspended.');}catch(e){notify(e.message,true)}}
reload().catch(e=>notify(e.message,true));
</script></body></html>
