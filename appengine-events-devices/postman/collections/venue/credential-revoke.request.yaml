{
  "$kind": "http-request",
  "method": "POST",
  "url": "{{base_url}}/events/credentials/{{credential_code}}/revoke",
  "order": 15000,
  "headers": [
    {
      "key": "orgid",
      "value": "{{org}}"
    },
    {
      "key": "Content-Type",
      "value": "application/json"
    }
  ],
  "settings": {
    "followRedirects": false
  },
  "scripts": [
    {
      "type": "beforeRequest",
      "language": "text/javascript",
      "code": "if(pm.variables.get('enabled_action') !== 'credential-revoke') throw new Error('Set enabled_action to credential-revoke only for this deliberate request; inspect saved state before repeating.');"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\n  \"reason\": \"Training credential retired\"\n}"
  }
}
