{
  "$kind": "http-request",
  "method": "POST",
  "url": "{{base_url}}/events/{{event_id}}/credentials/import",
  "order": 13000,
  "headers": [
    {
      "key": "orgid",
      "value": "{{org}}"
    },
    {
      "key": "Content-Type",
      "value": "application/json"
    }
  ],
  "settings": {
    "followRedirects": false
  },
  "scripts": [
    {
      "type": "beforeRequest",
      "language": "text/javascript",
      "code": "if(pm.variables.get('enabled_action') !== 'credential-import') throw new Error('Set enabled_action to credential-import only for this deliberate request; inspect saved state before repeating.');"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\n  \"codes\": [\n    \"{{credential_code}}\"\n  ],\n  \"type\": \"wristband\",\n  \"codeFormat\": \"barcode\"\n}"
  }
}
