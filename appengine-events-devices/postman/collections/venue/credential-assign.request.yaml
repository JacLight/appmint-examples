{
  "$kind": "http-request",
  "method": "POST",
  "url": "{{base_url}}/events/credentials/assign",
  "order": 14000,
  "headers": [
    {
      "key": "orgid",
      "value": "{{org}}"
    },
    {
      "key": "Content-Type",
      "value": "application/json"
    }
  ],
  "settings": {
    "followRedirects": false
  },
  "scripts": [
    {
      "type": "beforeRequest",
      "language": "text/javascript",
      "code": "if(pm.variables.get('enabled_action') !== 'credential-assign') throw new Error('Set enabled_action to credential-assign only for this deliberate request; inspect saved state before repeating.');"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\n  \"credentialCode\": \"{{credential_code}}\",\n  \"ticketId\": \"{{ticket_id}}\"\n}"
  }
}
