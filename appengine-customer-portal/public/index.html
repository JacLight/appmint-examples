<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northside · Customer portal</title><style>
@font-face{font-family:Inter;src:url(/assets/Inter.woff2)}*{box-sizing:border-box}body{margin:0;color:#17262a;background:#f5f8f7;font:18px Inter,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}aside{width:280px;background:#133c38;color:white;position:fixed;inset:0 auto 0 0;padding:42px 28px}.brand{font-size:30px;font-weight:800;letter-spacing:-1px}.brand b{color:#9bddbd}aside small{display:block;color:#a8c9c1;margin-top:9px}.nav{margin-top:58px;display:grid;gap:8px}.nav button{text-align:left;color:#bcd4ce;background:transparent;padding:18px;border-radius:12px}.nav button.active{background:#285c51;color:white}.nav button:hover{background:#285c51}.foot{position:absolute;bottom:32px;left:28px;right:28px;font-size:14px;line-height:1.6;color:#bfd6d0}main{margin-left:280px;padding:0 58px 50px}header{height:110px;border-bottom:1px solid #dce6e1;display:flex;align-items:center;justify-content:space-between}.context{font-size:15px;color:#597069}.context strong{display:block;font-size:20px;color:#173e35;margin-top:7px}.identity{display:flex;gap:14px;align-items:center}.avatar{border-radius:50%;background:#d4ece1;width:48px;height:48px;display:grid;place-items:center;font-weight:700}.light{color:#61736d;font-size:15px}.heading{display:flex;justify-content:space-between;align-items:end;margin:42px 0 28px}h1{font-size:38px;letter-spacing:-1px;margin:0 0 10px}h2{font-size:25px;margin:0 0 22px}h3{font-size:21px;margin:0 0 12px}p{line-height:1.55}.sub{color:#5a7069;margin:0}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:24px}.card{background:white;border:1px solid #dce6e1;border-radius:18px;padding:30px;box-shadow:0 5px 22px #153e3505}.stack{display:grid;gap:20px}.badge{align-self:flex-start;display:inline-block;background:#e1f3e8;color:#21734c;padding:7px 12px;border-radius:20px;font-size:14px;font-weight:700}.badge.cancelled{background:#eef0f1;color:#667273}.badge.pending{background:#fff1d2;color:#8c6719}.btn{background:#23674e;color:white;padding:13px 20px;border-radius:9px;font-weight:600}.btn.secondary{background:#eef4f0;color:#285b45}.btn.danger{background:#fff0ed;color:#9a4535}.actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}.label{color:#648074;text-transform:uppercase;font-size:12px;letter-spacing:1px;font-weight:700;margin-bottom:9px}.bigdate{font-size:27px;font-weight:600;margin:18px 0 10px}.divider{border-top:1px solid #e4ece7;margin:22px 0}.row{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid #ecf1ee}.row:last-child{border:0}.row p{margin:5px 0 0}.empty{padding:34px;background:#f7f9f7;border-radius:12px;color:#65776e}.notice{padding:17px 22px;border-radius:10px;margin:18px 0;background:#e1f3e8;border-left:4px solid #277451}.notice.error{background:#fff0eb;border-color:#a34835;color:#8b3528}label{display:block;font-size:15px;font-weight:600;margin-bottom:20px}input,select,textarea{display:block;width:100%;padding:13px;border:1px solid #bfcfc6;border-radius:8px;margin-top:8px;background:white;color:#18362a}textarea{min-height:130px}.login{max-width:800px;margin:90px auto}.login h1{font-size:48px}.personas{display:flex;gap:14px;margin-top:24px}.personas button{flex:1;text-align:left;padding:24px;border-radius:12px;background:#e8f2ec;color:#244d3b}.personas strong{display:block;font-size:21px}.personas small{display:block;margin-top:8px}.routehint{font-size:13px;color:#64796e;margin-top:18px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.slot{padding:18px;background:#edf5f0;color:#285b45;border-radius:10px}.slot:hover,.slot.selected{background:#23674e;color:white}dialog{width:820px;max-height:90vh;overflow:auto;border:0;border-radius:20px;padding:36px;box-shadow:0 20px 90px #14332844}dialog::backdrop{background:#122d2855}.close{float:right;background:#eef4f0;border-radius:50%;font-size:22px;width:40px;height:40px}.metric{font-size:40px;font-weight:700;color:#286447}.smallpill{font-size:12px;padding:6px 10px;background:#eef3ff;color:#526aa3;border-radius:10px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:18px 12px;border-bottom:1px solid #e5eee8}th{font-size:13px;color:#648074;text-transform:uppercase}#status:empty{display:none}@media(max-width:1000px){aside{width:210px}main{margin-left:210px;padding:0 24px}.grid{grid-template-columns:1fr}.slots{grid-template-columns:repeat(2,1fr)}}
</style><aside><div class="brand">northside<b>+</b></div><small>Customer self-service</small><nav class="nav"></nav><div class="foot">Sample client built on AppEngine<br>Training organization · no live charges</div></aside><main><header><div class="context">PURCHASING CONTEXT<strong id="context">Personal account</strong></div><div class="identity" id="identity"></div></header><div id="busy" role="status" style="display:none;position:fixed;right:38px;bottom:28px;background:#173e35;color:white;padding:14px 22px;border-radius:12px;z-index:100">Loading saved information…</div><div id="status" role="status"></div><div id="content"></div></main><dialog id="modal"><button class="close" onclick="modal.close()">×</button><div id="modalbody"></div></dialog><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selectedAccount=null;let session={},page='overview',bookings=[],orders=[],tickets=[],forms=[];
async function req(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error||v.message||`Request failed (${r.status})`);return v}
const api=async(method,...args)=>(await req('/api/action',{method,args})).data;const rows=v=>Array.isArray(v)?v:v?.data||[];const data=v=>v?.data||v||{};
function notify(text,error=false){$('#status').innerHTML=`<div class="notice ${error?'error':''}">${esc(text)}</div>`}let busyCount=0;async function act(fn){busyCount++;$('#busy').style.display='block';try{await fn()}catch(e){notify(e.message,true);if(modal.open){let n=document.querySelector('#modalerror');if(!n){n=document.createElement('div');n.id='modalerror';n.className='notice error';document.querySelector('#modalbody').prepend(n)}n.textContent=e.message}}finally{busyCount--;if(!busyCount)$('#busy').style.display='none'}}
const date=(s,tz='America/Chicago')=>new Intl.DateTimeFormat('en-US',{weekday:'long',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:tz}).format(new Date(s));
function badge(s){return `<span class="badge ${esc(s)}">${esc(s||'Saved')}</span>`}function heading(title,sub){return `<div class="heading"><div><h1>${title}</h1><p class="sub">${sub}</p></div></div>`}
function nav(){const items=[['overview','Overview'],['bookings','Appointments'],['orders','Orders'],['support','Support'],['forms','My forms'],['profile','My profile'],['company','Company account'],['checks','Access checks']];$('.nav').innerHTML=items.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');const p=data(session.profile);$('#identity').innerHTML=session.persona?`<div class="avatar">${esc((p.firstName||'?')[0])}</div><div><strong>${esc(p.firstName||session.persona)} ${esc(p.lastName||'')}</strong><div class="light">Signed-in customer</div></div><button class="btn secondary" onclick="logout()">Sign out</button>`:'';$('#context').textContent=session.accountName||'Personal account'}
async function login(persona){await act(async()=>{await req('/api/signin',{persona});session=await req('/api/session');await go('overview')})}async function logout(){await req('/api/signout',{});session={};renderLogin()}
function renderLogin(){nav();$('#content').innerHTML=`<div class="login"><span class="smallpill">APPENGINE REFERENCE CLIENT</span><h1 style="margin-top:24px">Your care.<br>Your account.</h1><p class="sub">Manage appointments, review your records and get support in one place.</p><div class="card" style="margin-top:30px"><h2>Open a training customer session</h2><p class="sub">Each person signs in with their own isolated customer account.</p><div class="personas"><button onclick="login('dana')"><strong>Dana Ruiz</strong><small>Personal customer</small></button><button onclick="login('priya')"><strong>Priya Shah</strong><small>Company manager</small></button><button onclick="login('noah')"><strong>Noah Brooks</strong><small>Company buyer</small></button><button onclick="login('elli')"><strong>Elli Park</strong><small>Invited customer</small></button></div></div></div>`}
async function go(next){page=next;$('#status').innerHTML='';nav();await act(async()=>{if(next==='overview'){[bookings,orders,tickets]=await Promise.all([api('reservations'),api('orders'),api('tickets')]).then(x=>x.map(rows));$('#content').innerHTML=heading('Welcome back, '+esc(data(session.profile).firstName),'Your appointments, records and support — connected to your customer account.')+`<div class="grid"><div class="card"><div class="label">Your appointment</div>${bookingCard(bookings.find(x=>x.data?.status!=='cancelled')||bookings[0])}</div><div class="stack"><div class="card"><h2>Your records</h2><div class="row"><span>Orders</span><strong>${orders.length}</strong></div><div class="row"><span>Support requests</span><strong>${tickets.length}</strong></div><div class="actions"><button class="btn secondary" onclick="go('orders')">View orders</button><button class="btn secondary" onclick="go('support')">Get support</button></div></div><div class="card"><h3>Keep your details up to date</h3><p class="sub">Review your name and contact number.</p><div class="actions"><button class="btn secondary" onclick="go('profile')">My profile</button></div></div></div></div>`}
if(next==='bookings'){bookings=rows(await api('reservations'));$('#content').innerHTML=heading('Appointments','Review your saved bookings and choose an available time.')+`<div class="stack">${bookings.length?bookings.map(b=>`<div class="card">${bookingCard(b)}</div>`).join(''):'<div class="empty">No appointments in this customer account.</div>'}</div>`}
if(next==='profile'){session.profile=await api('profile');nav();const p=data(session.profile);$('#content').innerHTML=heading('My profile','Update the contact details AppEngine allows customers to change.')+`<div class="grid"><form class="card" id="profileform"><label>First name<input name="firstName" value="${esc(p.firstName)}"></label><label>Last name<input name="lastName" value="${esc(p.lastName)}"></label><label>Phone<input name="phone" value="${esc(p.phone)}"></label><button class="btn">Save changes</button></form><div class="card"><h2>Account identity</h2><div class="label">Sign-in email</div><p>${esc(p.email)}</p><div class="divider"></div><p class="sub">Changing a phone number updates the saved contact detail. It does not verify possession of the number.</p><p>Phone verified: <strong>${p.phoneVerified?'Yes':'No'}</strong></p></div></div>`;$('#profileform').onsubmit=e=>{e.preventDefault();act(async()=>{session.profile=await api('updateProfile',Object.fromEntries(new FormData(e.target)));await go('profile');notify('Profile saved and reloaded from AppEngine.')})}}
if(next==='orders'){orders=rows(await api('orders'));$('#content').innerHTML=heading('My orders','Orders associated with your signed-in customer identity.')+`<div class="card">${orders.length?orders.map(o=>`<div class="row"><div><h3>Order ${esc(o.data?.number)}</h3><p class="light">${esc(o.data?.currency||'USD')} ${esc(o.data?.amount??o.data?.total??'')} · ${esc(o.data?.status)}</p></div><button class="btn secondary" onclick="openOrder('${esc(o.data?.number)}')">View order</button></div>`).join(''):'<div class="empty">No orders found for this customer.</div>'}</div>`}
if(next==='support'){tickets=rows(await api('tickets'));$('#content').innerHTML=heading('Support','Ask a question and return to its saved ticket.')+`<div class="grid"><div class="card"><h2>Your requests</h2>${tickets.length?tickets.map(t=>`<div class="row"><div><strong>${esc(t.data?.title)}</strong><p class="light">${esc(t.data?.name)} · ${esc(t.data?.status)}</p></div><button class="btn secondary" onclick="openTicket('${esc(t.data?.name)}')">Open</button></div>`).join(''):'<div class="empty">No support requests yet.</div>'}</div><form class="card" id="ticketform"><h2>New request</h2><label>Subject<input name="title" required></label><label>How can we help?<textarea name="description" required></textarea></label><button class="btn">Send request</button></form></div>`;$('#ticketform').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));act(async()=>{await api('openTicket',f.title,f.description);await go('support');notify('Request saved. Its ticket number is now available in your account.')})}}
if(next==='forms'){forms=rows(await api('forms'));$('#content').innerHTML=heading('My forms','Saved answers and forms waiting for your response.')+`<div class="stack">${forms.length?forms.map(f=>`<div class="card"><h2>${esc(f.form?.title||f.form?.name||'Form response')}</h2>${badge(f.status)}<div class="divider"></div>${Object.entries(f.values||{}).map(([k,v])=>`<div class="row"><span>${esc(f.form?.schema?.properties?.[k]?.title||k)}</span><strong>${esc(v)}</strong></div>`).join('')}</div>`).join(''):'<div class="empty">No submitted or pending forms in this account.</div>'}</div>`}
if(next==='company')await company();if(next==='checks')checks();})}
function bookingCard(b){if(!b)return '<div class="empty">No appointments yet.</div>';const d=b.data;return `<div style="display:flex;justify-content:space-between"><h2>${esc(d.service)}</h2>${badge(d.status)}</div><div class="bigdate">${date(d.startTime,d.timezone||'America/Chicago')}</div><p class="sub">${esc(d.timezone||'America/Chicago')} · Booking ${esc(d.name)}</p><div class="actions"><button class="btn secondary" onclick="openBooking('${b.sk}')">View details</button>${d.status!=='cancelled'?`<button class="btn" onclick="changeBooking('${b.sk}')">Change time</button><button class="btn danger" onclick="cancelBooking('${b.sk}')">Cancel appointment</button>`:''}</div>`}
async function openBooking(id){await act(async()=>{const b=await api('reservation',id);$('#modalbody').innerHTML='<h2>Appointment details</h2>'+bookingCard(b)+`<div class="divider"></div><p>Saved customer: ${esc(b.data?.customer?.email)}</p>`;modal.showModal()})}
async function changeBooking(id){await act(async()=>{const booking=await api('reservation',id);let timezone=booking.data.timezone||'America/Chicago';const from=new Intl.DateTimeFormat('en-CA',{timeZone:timezone,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(booking.data.startTime));const v=await api('availability',id,from,7);timezone=v.timezone||timezone;window.currentSlots=v;const flat=Array.isArray(v)?v:(v.slots||v.days||v.data||[]);const slots=flat.flatMap(x=>x.slots||x.availableSlots||[x]).filter(x=>x.startTime && (x.spotsAvailable===undefined || x.spotsAvailable>0));$('#modalbody').innerHTML=`<h2>Choose an available time</h2><p class="sub">Times returned for this booking’s service and definition. ${esc(timezone)}.</p><div class="divider"></div><div class="slots">${slots.slice(0,12).map(x=>`<button class="slot" onclick="moveBooking('${id}','${x.startTime}')">${date(x.startTime,timezone)}</button>`).join('')}</div>${!slots.length?'<p>No available times found in this period.</p>':''}`;modal.showModal()})}
async function moveBooking(id,time){await act(async()=>{await api('move',id,time,'Changed in the customer portal');modal.close();await go('bookings');notify('Appointment moved. The new time above was read back from the saved booking.')})}
async function cancelBooking(id){$('#modalbody').innerHTML=`<h2>Cancel this appointment?</h2><p>The booking will remain in your history with its cancellation status.</p><div class="actions"><button class="btn danger" onclick="confirmCancel('${id}')">Confirm cancellation</button><button class="btn secondary" onclick="modal.close()">Keep appointment</button></div>`;modal.showModal()}
async function confirmCancel(id){await act(async()=>{await api('cancel',id);modal.close();await go('bookings');notify('Appointment cancelled and saved status reloaded.')})}
async function openOrder(number){await act(async()=>{const o=await api('order',number);$('#modalbody').innerHTML=o?`<h2>Order ${esc(o.data.number)}</h2>${badge(o.data.status)}<div class="divider"></div>${(o.data.productItems||[]).map(i=>`<div class="row"><span>${esc(i.name||i.title||i.sku)}</span><strong>${esc(i.quantity)}</strong></div>`).join('')}`:'<h2>Order unavailable</h2><p>No matching order belongs to this customer.</p>';modal.showModal()})}
async function openTicket(number){await act(async()=>{const t=rows(await api('ticket',number))[0];$('#modalbody').innerHTML=t?`<h2>${esc(t.data.title)}</h2>${badge(t.data.status)}<p class="light">${esc(t.data.name)}</p><div class="divider"></div><p>${esc(t.data.description)}</p>`:'<h2>Request unavailable</h2><p>No matching ticket belongs to this customer.</p>';modal.showModal()})}
function checks(){$('#content').innerHTML=heading('Customer access checks','Developer check: request Dana’s controlled training records using the current customer session.')+`<div class="card"><p class="sub">This is a test view in the sample client. The result comes from AppEngine through the same trusted server adapter.</p><div class="divider"></div><div class="row"><div><h3>Dana’s appointment</h3><p class="light">Owned reservation detail · record ID</p></div><button class="btn secondary" onclick="checkRecord('reservation',session.fixture.bookingId,'booking-check')">Check appointment</button><strong id="booking-check">Not checked</strong></div><div class="row"><div><h3>Dana’s order</h3><p class="light">Order detail · order number</p></div><button class="btn secondary" onclick="checkRecord('order',session.fixture.orderNumber,'order-check')">Check order</button><strong id="order-check">Not checked</strong></div><div class="row"><div><h3>Dana’s support request</h3><p class="light">Ticket detail · ticket number</p></div><button class="btn secondary" onclick="checkRecord('ticket',session.fixture.ticketNumber,'ticket-check')">Check ticket</button><strong id="ticket-check">Not checked</strong></div></div>`}
async function checkRecord(method,id,target){const el=document.getElementById(target);el.textContent='Checking…';try{const v=await api(method,id);el.textContent=method==='ticket'?(rows(v).length?'Record returned':'No ticket returned'):v?'Record returned':'No order returned';el.style.color='#7a5630'}catch(e){el.textContent=e.message;el.style.color='#983e2d'}}
async function company(){session=await req('/api/session');nav();const accounts=session.profile?.sharedAccounts||data(session.profile).sharedAccounts||[];const account=accounts.find(a=>(a.sk||a.id||a.sharedAccountId)===session.fixture?.accountId)||accounts[0];const id=account?.sk||account?.id||account?.sharedAccountId;selectedAccount=account?{...account,id}:null;if(!id){$('#content').innerHTML=heading('Company account','Shared purchasing membership is loaded from your current customer profile.')+'<div class="card"><div class="empty">No active company account is available for this customer.</div></div>'+invitationList();return;}let members,err;try{members=await api('members',id)}catch(e){err=e.message}const m=rows(members);$('#content').innerHTML=heading('Company account','Choose who you are purchasing for. Manage membership when you are an account manager.')+`<div class="card"><div class="row"><div><h2>${esc(account.name)}</h2><p class="sub">Shared purchasing account · ${esc(account.role)}</p></div><div class="actions" style="margin:0"><button class="btn" onclick="selectAccount('${id}')">Buy for ${esc(account.name)}</button><button class="btn secondary" onclick="selectAccount(null)">Use personal account</button></div></div>${err?`<div class="notice">${esc(err)}</div>`:`<table><thead><tr><th>Member</th><th>Role</th><th>Status</th><th>Manage</th></tr></thead><tbody>${m.map(x=>{const d=x.data||x;return `<tr><td>${esc(d.customerId||d.email)}</td><td>${esc(d.role)}</td><td>${esc(d.status)}</td><td><button class="btn secondary" onclick="member('${x.associationId||x.sk}','${d.status==='suspended'?'active':'suspended'}')">${d.status==='suspended'?'Reinstate':'Suspend'}</button></td></tr>`}).join('')}</tbody></table><div class="actions"><button class="btn secondary" onclick="inviteMember()">Add a member</button><button class="btn secondary" onclick="companyOrders()">Company orders</button></div>`}</div>`+invitationList();const cart=await api('cart');$('#content').insertAdjacentHTML('beforeend',cartView(cart));}
function invitationList(){return (session.pendingInvites||[]).map(i=>`<div class="card" style="margin-top:24px"><h2>Invitation to ${esc(i.accountName)}</h2><p class="sub">Pending · ${esc(i.role)} membership</p><div class="actions"><button class="btn" onclick="acceptInvite('${i.inviteId}')">Review invitation</button></div></div>`).join('')}
function cartView(c){const d=c?.data||{};return `<div class="card" style="margin-top:24px"><h2>Current purchasing cart</h2><p class="sub">Read using the current customer session after account selection.</p><div class="divider"></div>${c?`<div class="row"><span>Saved cart</span><strong>${esc(c.sk?.slice(-8)||d.name)}</strong></div><div class="row"><span>Company context</span><strong>${esc(d.sharedAccountId ? selectedAccount?.name||'Company' : 'Personal')}</strong></div><div class="row"><span>Items</span><strong>${esc((d.items||d.productItems||[]).reduce((n,x)=>n+Number(x.quantity||1),0))}</strong></div>`:'<div class="empty">No cart saved in this purchasing context.</div>'}</div>`}
async function acceptInvite(id){await act(async()=>{const v=await api('validatePendingInvite',id);$('#modalbody').innerHTML=`<h2>Join this company account</h2><p>The invitation has been checked for this signed-in customer.</p><button class="btn" onclick="finishInvite('${id}')">Accept invitation</button>`;modal.showModal()})}
async function finishInvite(id){await act(async()=>{await api('acceptPendingInvite',id);modal.close();session=await req('/api/session');await go('company');notify('Invitation accepted. Company membership is now available.')})}
async function selectAccount(id){await act(async()=>{await api('switchAccount',id);session=await req('/api/session');await go('company');notify(id?'Purchasing context changed. Subsequent requests use the new session.':'Returned to your personal purchasing context.')})}
async function member(id,status){await act(async()=>{await api('member',selectedAccount.id,id,{status});await go('company');notify('Membership saved and reloaded.')})}
function inviteMember(){$('#modalbody').innerHTML=`<h2>Add a company member</h2><form id="memberform"><label>Customer email<input name="email" value="noah.portal-usecase-1013@training.local" required></label><label>Role<select name="role"><option value="buyer">Buyer</option><option value="manager">Manager</option></select></label><button class="btn">Add member</button></form>`;modal.showModal();$('#memberform').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));act(async()=>{const v=await api('invite',selectedAccount.id,f.email,f.role);modal.close();await go('company');notify(v.added?'Existing customer added to the account.':'Invitation saved; delivery is a separate provider outcome.')})}}
async function companyOrders(){await act(async()=>{const o=rows(await api('companyOrders',selectedAccount.id));$('#modalbody').innerHTML=`<h2>${esc(selectedAccount.name)} orders</h2>`+ (o.length?o.map(x=>`<div class="row"><strong>${esc(x.data.number)}</strong>${badge(x.data.status)}</div>`).join(''):'<div class="empty">No orders placed on this shared account yet.</div>');modal.showModal()})}
(async()=>{try{session=await req('/api/session');if(session.persona)await go('overview');else renderLogin()}catch{renderLogin()}})();
</script></html>
